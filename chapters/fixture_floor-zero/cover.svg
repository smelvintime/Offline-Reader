<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450" role="img" aria-label="Elevator to Floor Zero">
  <defs>
    <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1c1f"/>
      <stop offset="60%" stop-color="#101215"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="spill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd88a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffd88a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="300" height="450" fill="url(#shaft)"/>

  <!-- light spilling out of a lift door, downward -->
  <path d="M120 150 H180 L214 450 H86 Z" fill="url(#spill)" opacity="0.5"/>

  <!-- the lift doors, ajar -->
  <g fill="#23282e" stroke="#3c444d" stroke-width="3">
    <rect x="72" y="96" width="46" height="118"/>
    <rect x="182" y="96" width="46" height="118"/>
  </g>
  <rect x="118" y="96" width="64" height="118" fill="#ffe6ae"/>
  <rect x="66" y="86" width="168" height="12" rx="3" fill="#3c444d"/>

  <!-- a figure standing in the gap -->
  <g fill="#12151a">
    <circle cx="150" cy="128" r="11"/>
    <path d="M150 140 q-16 6 -16 30 v44 h32 v-44 q0 -24 -16 -30 Z"/>
  </g>

  <!-- the brass panel, out to one side -->
  <g>
    <rect x="228" y="236" width="46" height="128" rx="6" fill="#c9a349" stroke="#6b5320" stroke-width="2"/>
    <g fill="#6b5320">
      <circle cx="251" cy="258" r="6"/>
      <circle cx="251" cy="282" r="6"/>
      <circle cx="251" cy="306" r="6"/>
      <circle cx="251" cy="330" r="6"/>
    </g>
    <circle cx="251" cy="350" r="7" fill="#ffe6ae" stroke="#6b5320" stroke-width="2"/>
    <text x="251" y="355" font-family="Verdana, Geneva, sans-serif" font-size="9" text-anchor="middle" fill="#6b5320">0</text>
  </g>

  <!-- floor markers going down -->
  <g fill="#4a545e" font-family="Verdana, Geneva, sans-serif" font-size="10" text-anchor="start">
    <text x="26" y="262">B1</text>
    <text x="26" y="292">B2</text>
    <text x="26" y="322">-3</text>
    <text x="26" y="352">-6</text>
    <text x="26" y="382">-9</text>
  </g>
  <g stroke="#2a3138" stroke-width="2">
    <path d="M26 268 H62"/><path d="M26 298 H62"/><path d="M26 328 H62"/>
    <path d="M26 358 H62"/><path d="M26 388 H62"/>
  </g>

  <g fill="#f2f4f6" font-family="Verdana, Geneva, sans-serif" text-anchor="middle">
    <text x="150" y="412" font-size="19" letter-spacing="1">ELEVATOR TO</text>
    <text x="150" y="436" font-size="19" letter-spacing="1">FLOOR ZERO</text>
  </g>
  <text x="150" y="44" fill="#7c8792" font-family="Verdana, Geneva, sans-serif" font-size="10" letter-spacing="4" text-anchor="middle">SAMPLE SERIES</text>
</svg>
