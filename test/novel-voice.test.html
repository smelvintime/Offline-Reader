        'and neither is one that is merely close') && pass;
      ne.speed = null;
      pass = ok(VT().prebufferTargetSeconds() === 0,
        'unmeasured does not invent a deficit out of nothing') && pass;

      // ── a real deficit, capped at what anyone will sit through ──────────
      // The phone's own number. 0.92x over a 2000-second chapter is 160
      // seconds short, which is far past the cap, so the cap is what applies.
      // Startup is intentionally thermal-bounded: fifteen wall seconds of
      // generating buys 15 x 0.92 seconds of audio, then playback begins.
      ne.noteSpeed({ ms: 1000, seconds: 0.92, chars: 18.4 });
      const capped = VT().prebufferTargetSeconds();
      pass = ok(VT().NEURAL_PREBUFFER_MAX_SEC === 15 && Math.abs(capped - 15 * 0.92) < 0.5,
        'a long chapter gets at most fifteen wall seconds of startup generation',
        capped.toFixed(1) + 's') && pass;

      // A short chapter's whole deficit fits inside the cap, so it is paid in
      // full and the chapter really does play through without a gap.
      st.sentences = list.slice(0, 10);          // 2000 chars, 100 s of speech
      const full = VT().prebufferTargetSeconds();
      const expected = (1 - 0.92) * 100 * 1.35;
      pass = ok(Math.abs(full - expected) < 0.5,
        'a short one pays its whole deficit, safety margin included',
        full.toFixed(1) + 's vs ' + expected.toFixed(1) + 's') && pass;
      pass = ok(full < capped, 'and a short chapter never waits longer than a long one',
        full.toFixed(1) + 's < ' + capped.toFixed(1) + 's') && pass;

      // The fifteen-second heat budget starts before the first clip renders.
      // Advancing a fake clock through that first render must not buy a fresh
      // fifteen seconds for speculative clips behind it.
      pass = ok(typeof VT().startupPrebufferDeadline === 'function',
        'the startup budget has one deadline shared by first clip and lookahead') && pass;
      if (typeof VT().startupPrebufferDeadline === 'function') {
        const realNow = Date.now;
        let fakeNow = 100000;
        Date.now = function () { return fakeNow; };
        const deadline = VT().startupPrebufferDeadline();
        fakeNow += 12000;              // first clip consumed twelve seconds
        pass = ok(deadline - Date.now() === 3000,
          'first-clip generation is charged against the fifteen-second startup budget',
          (deadline - Date.now()) + 'ms remain') && pass;
        Date.now = realNow;
      }

      // ── what counts as buffered ─────────────────────────────────────────
      // Unbroken is the point: audio past a hole cannot be played through it.
      st.sentences = list;
      const g0 = VT().groupSentences(list, 0);
      const g1 = VT().groupSentences(list, 1);
      const g2 = VT().groupSentences(list, 2);
      pass = ok(typeof VT().awaitPrebuffer === 'function',
        'prebuffer enforcement is directly regression-testable') && pass;
      if (typeof VT().awaitPrebuffer === 'function') {
        let generatedAfterBudget = 0;
        const realNow = Date.now;
        Date.now = function () { return 50000; };
        st.playing = true;
        ne.worker = {};
        ne.generate = function () { generatedAfterBudget++; return Promise.resolve('blob:none'); };
        await VT().awaitPrebuffer(g0, st.speakToken, 49999);
        pass = ok(generatedAfterBudget === 0,
          'an expired shared startup deadline schedules no lookahead generation',
          'extra jobs=' + generatedAfterBudget) && pass;
        Date.now = realNow;
        st.playing = held.playing;
        ne.worker = held.worker;
        ne.generate = held.generate;
      }

      pass = ok(typeof VT().speakNeural === 'function',
        'first-clip scheduling is directly regression-testable') && pass;
      if (typeof VT().speakNeural === 'function') {
        const realNow = Date.now;
        let fakeNow = 80000;
        Date.now = function () { return fakeNow; };
        let finishFirst;
        const firstClip = new Promise(function (resolve) { finishFirst = resolve; });
        const generated = [];
        ne.worker = {};
        ne.generate = function (key) {
          generated.push(key);
          return generated.length === 1 ? firstClip : Promise.resolve('blob:lookahead');
        };
        VT().channel.play = function () { return Promise.resolve(); };
        st.sentences = list.slice(0, 4);
        st.chapterId = 'prebuffer-caller';
        st.index = 0;
        st.fastStart = true;
        st.groupCaps = null;
        st.playing = true;
        const token = st.speakToken;
        VT().speakNeural(st.sentences[0], token, function () {}, function () {});
        await pause(VT().NEURAL_PUMP_MS + 100);
        pass = ok(generated.length === 1,
          'the prefetch pump stays off while the first clip consumes startup budget',
          'generation calls=' + generated.length) && pass;
        fakeNow += 16000;           // first clip finished after the budget expired
        finishFirst('blob:first');
        await pause(50);
        pass = ok(generated.length === 1,
          'an over-budget first clip does not trigger unconditional lookahead',
          'generation calls=' + generated.length) && pass;
        VT().pause();               // also clears any pump the completed call started
        Date.now = realNow;
        VT().channel.play = held.channelPlay;
        ne.worker = held.worker;
        ne.generate = held.generate;
        st.sentences = list;
        st.chapterId = 'prebuffer-test';
        st.index = 0;
        st.playing = held.playing;
        st.fastStart = held.fastStart;
        st.group = held.group;
        st.groupCaps = held.groupCaps;
      }
      const key = function (g) {
        return 'prebuffer-test:' + g.blockIdx + ':' + g.start + ':' + g.end + ':' + st.prefs.neuralVoice;
      };
      pass = ok(VT().bufferedAhead(g0) === 0, 'nothing generated is nothing buffered') && pass;
      ne.clipSeconds.set(key(g1), 10);
      pass = ok(VT().bufferedAhead(g0) === 10, 'one ready group is ten seconds of runway',
        String(VT().bufferedAhead(g0))) && pass;
      ne.clipSeconds.set(key(g2), 10);
      pass = ok(VT().bufferedAhead(g0) === 20, 'two in a row is twenty',
        String(VT().bufferedAhead(g0))) && pass;
      ne.clipSeconds.delete(key(g1));
      pass = ok(VT().bufferedAhead(g0) === 0,
        'and a hole at the front makes everything behind it unreachable',
        String(VT().bufferedAhead(g0))) && pass;
      ne.clipSeconds.delete(key(g2));

      // ── while buffering, generate flat out ──────────────────────────────
      // The one time a slow device should be at full tilt: it is generating
      // into a wait, not into a queue it can never keep.
      ne.noteSpeed({ ms: 1000, seconds: 0.92, chars: 18.4 });
      pass = ok(VT().lookaheadSeconds() === 0,
        'below break-even steady state avoids a speculative backlog') && pass;
      st.prebuffer = { target: 55, got: 0 };
      pass = ok(VT().lookaheadSeconds() === 55,
        'but while a buffer is being built the target is the lookahead',
        String(VT().lookaheadSeconds())) && pass;
      st.prebuffer = null;
      pass = ok(VT().lookaheadSeconds() === 0,
        'and it returns to next-clip-only afterwards') && pass;
    } finally {
      ne.speed = held.speed;
      ne.clipSeconds.clear();
      st.sentences = held.sentences;
      st.chapterId = held.chapterId;
      st.prefs.rate = held.rate;
      st.index = held.index;
      st.prebuffer = held.prebuffer;
      st.playing = held.playing;
      ne.worker = held.worker;
      ne.generate = held.generate;
      st.fastStart = held.fastStart;
      st.group = held.group;
      st.groupCaps = held.groupCaps;
      VT().channel.play = held.channelPlay;
    }
    return { name: 'prebuffer', pass };
  },

  // The natural-voice panel has to actually run.
  //
  // It did not, for an unknown number of builds. `removeBtn` was passed to
  // syncNeuralStatus and never declared anywhere — "Remove download" had been
  // deleted from the sheet on purpose and its references left behind — so
  // evaluating the argument threw a ReferenceError before the function was
  // entered, and syncSheet's per-control catch swallowed it whole. The symptom
  // was a download button, in an app that ships the weights inside itself,
  // frozen at the label it was built with. Nothing logged, nothing to report.
  // Two rounds of correcting that function's branch logic could not have
  // worked, because no branch was ever reached.
  //
  // So these assert the panel SYNCS, not that its logic is right. Every test
  // here was reading the logic of a function that never ran.
  async testVoicePanelSyncs() {
    let pass = true;
    const heldPlatform = window.Platform;
    try {
      await freshOpen();
      V().toggle();
      await pause(250);
      document.querySelector('.vc-bar [aria-label="Voice settings"]').click();
      await pause(300);

      const natText = document.querySelector('.vc-sheet .vc-nat-status .vc-hint');
      pass = ok(!!natText, 'the natural-voice panel is in the sheet') && pass;
      pass = ok(natText && natText.textContent.trim().length > 0,
        'and it has something to say: an empty panel means its sync threw',
        JSON.stringify(natText && natText.textContent)) && pass;
      pass = ok(VT().syncError() === '',
        'no sheet control threw while syncing', VT().syncError() || 'none') && pass;

      // In the app the weights ARE the app: nothing to download, in any state
      // syncNeuralStatus can reach. window.Platform is absent from this page,
      // so isNativeApp() is false here and every native branch in the module
      // went untested — which is its own reason this survived.
      window.Platform = Object.assign({}, window.Platform, { isNative: true });
      const st = VT().state;
      const held = { bundled: st.neuralBundled, have: st.neuralHave };
      const combos = [[true, true], [false, true], [false, false], [null, null]];
      let offered = null;
      for (let i = 0; i < combos.length; i++) {
        st.neuralBundled = combos[i][0];
        st.neuralHave = combos[i][1];
        VT().syncSheet();
        await pause(60);
        const shown = [].slice.call(document.querySelectorAll('.vc-sheet button'))
          .filter(function (x) { return !x.hidden && /download|remove/i.test(x.textContent); });
        if (shown.length && !offered) {
          offered = 'bundled=' + combos[i][0] + ' have=' + combos[i][1] + ' → ' + shown[0].textContent;
        }
      }
      st.neuralBundled = held.bundled;
      st.neuralHave = held.have;
      pass = ok(!offered, 'the app never offers to download or remove a file it ships',
        offered || 'none in any state') && pass;
      pass = ok(VT().syncError() === '', 'and still nothing threw across all of them',
        VT().syncError() || 'none') && pass;
    } finally {
      window.Platform = heldPlatform;
      endSession();
    }
    return { name: 'voice panel', pass };
  },

  // Weights shipped inside the app: the phone must never be told to download
  // something it already has, and the probe has to work over the custom URL
  // scheme the native shell serves from.
  async testBundledWeights() {
    let pass = true;
    const ne = VT().neuralEngine;
    const realFetch = window.fetch;
    const asked = [];
    const stubFetch = (answer) => {
      window.fetch = function (url, opts) {
        const u = String(url);
        if (u.indexOf('/vendor/tts/models/') !== -1) {
          asked.push((opts && opts.method ? opts.method : 'GET') + ' ' + u.split('/').pop());
          return answer(u);
        }
        return realFetch.apply(window, arguments);
      };
    };
    try {
      stubFetch(() => Promise.resolve({ ok: true }));
      ne.bundledCache = null;
      pass = ok(await ne.bundled() === true, 'bundled weights are found') && pass;
      // A HEAD is the wrong tool: a custom scheme handler only answers the
      // request types it implements, and GET is the one they all do.
      pass = ok(asked.length === 1 && asked[0] === 'GET config.json',
        'probed with a plain GET of the small file next to the weights', asked.join(' | ')) && pass;

      await ne.bundled();
      pass = ok(asked.length === 1, 'the probe is memoised', asked.length + ' fetches') && pass;
      pass = ok(await ne.downloaded() === true, 'bundled counts as present') && pass;

      // Nothing bundled: falls through to the cache probe, which is what keeps
      // the plain web app downloading exactly as it did before.
      ne.bundledCache = null;
      stubFetch(() => Promise.resolve({ ok: false, status: 404 }));
      pass = ok(await ne.bundled() === false, 'no bundled weights -> false') && pass;
      pass = ok(await ne.downloaded() === false, 'and nothing cached -> still a download') && pass;
      // "Download voice (~90 MB)" on a build that bundles its weights is this
      // probe having failed, and 404 (never reached the bundle) wants a
      // different fix from a throw (the scheme handler refused it). Saying
      // which is the difference between one rebuild and three.
      pass = ok(ne.bundledWhy === 'weights HTTP 404', 'a miss records the status', ne.bundledWhy) && pass;
      pass = ok(VT().neuralCapabilityLine().indexOf('weights: absent') === -1,
        'the specific status replaces the generic "absent"', VT().neuralCapabilityLine()) && pass;
      pass = ok(VT().neuralCapabilityLine().indexOf('weights HTTP 404') !== -1,
        'and it reaches the line the reader can screenshot', VT().neuralCapabilityLine()) && pass;

      // A probe that throws is a "no", not a crash.
      ne.bundledCache = null;
      ne.bundledWhy = '';
      stubFetch(() => Promise.reject(new Error('nope')));
      pass = ok(await ne.bundled() === false, 'a throwing probe answers no rather than rejecting') && pass;
      pass = ok(/weights unreachable: nope/.test(ne.bundledWhy),
        'and a throw is reported as unreachable, not as a status', ne.bundledWhy) && pass;

      // A build that has them says nothing extra: the line stays short.
      ne.bundledCache = null;
      ne.bundledWhy = '';
      stubFetch(() => Promise.resolve({ ok: true }));
      await ne.bundled();
      pass = ok(ne.bundledWhy === '', 'a found build records no failure', ne.bundledWhy) && pass;
      pass = ok(VT().neuralCapabilityLine().indexOf('weights: in app') !== -1,
        'and the line says so positively rather than staying silent',
        VT().neuralCapabilityLine()) && pass;
    } finally {
      window.fetch = realFetch;
      ne.bundledCache = null;
      ne.bundledWhy = '';
    }
    return { name: 'bundled weights', pass };
  },


  async testMemoryTier() {
    let pass = true;
    neuralStub.restore();            // counts real ensureReady calls
    const ne = VT().neuralEngine;
    const origDownloaded = ne.downloaded;
    const origEnsure = ne.ensureReady;
    try {
      // low memory: release() frees the engine immediately.
      window.Platform = { memoryClass: function () { return 'low'; } };
      let terminated = 0;
      ne.worker = { postMessage: function () {}, terminate: function () { terminated++; } };
      ne.readyPromise = Promise.resolve(); ne.ready = true;
      ne.release();
      pass = ok(terminated === 1 && ne.worker === null, 'low memory: release disposes immediately') && pass;

      // high memory: release keeps the engine warm behind an idle timer.
      window.Platform = { memoryClass: function () { return 'high'; } };
      terminated = 0;
      ne.worker = { postMessage: function () {}, terminate: function () { terminated++; } };
      ne.readyPromise = Promise.resolve(); ne.ready = true;
      ne.release();
      pass = ok(terminated === 0 && !!ne.worker && !!ne.idleTimer, 'high memory: release keeps the engine warm') && pass;
      ne.dispose();

      // Prewarm on book open fires on HIGH-memory devices only, even with the
      // model on disk.
      let warmed = 0;
      ne.downloaded = function () { return Promise.resolve(true); };
      ne.ensureReady = function () { warmed++; return Promise.resolve(); };
      await freshOpen();
      window.Platform = { memoryClass: function () { return 'mid'; } };
      // freshOpen() opens a book of its own, and with one engine there is no
      // longer an engine pref to short-circuit prewarm. Count only the open
      // that happens under the memory class being tested.
      warmed = 0;
      await window.NovelReader.open({ series: SERIES, chapter: SERIES.chapters[0], blocks: CHAPTERS[0].blocks, resume: null });
      await pause(150);
      pass = ok(warmed === 0, 'mid memory: no background prewarm on book open') && pass;
      window.Platform = { memoryClass: function () { return 'high'; } };
      await window.NovelReader.open({ series: SERIES, chapter: SERIES.chapters[0], blocks: CHAPTERS[0].blocks, resume: null });
      await pause(150);
      pass = ok(warmed === 0, 'high memory: initial reader paint is not competing with voice startup') && pass;
      await pause(VT().PREWARM_DELAY_MS + 500);
      pass = ok(warmed >= 1, 'high memory: the downloaded engine prewarms after the reader settles', 'warmed=' + warmed) && pass;
    } finally {
      neuralStub.resume();       // hand the engine back to the shared stub
      ne.downloaded = origDownloaded;
      ne.ensureReady = origEnsure;
      ne.ready = false; ne.readyPromise = null; ne.worker = null;
      delete window.Platform;
      endSession();
    }
    return { name: 'memory tier', pass };
  },

  async testGrouping() {
    let pass = true;
    const s = VT().segmentBlocks(CHAPTERS[0].blocks, blockText);
    // Block 1 holds two short sentences — one generation group, so the model
    // speaks them as a single continuous passage (the "choppy one sentence
    // at a time" fix).
    const b1 = s.findIndex(x => x.blockIdx === 1);
    const g = VT().groupSentences(s, b1);
    pass = ok(g.from === b1 && g.to === b1 + 1, 'two short same-block sentences merge into one group',
      g.from + '..' + g.to) && pass;
    pass = ok(g.text === s[b1].text + ' ' + s[b1 + 1].text, 'group text is the sentences joined') && pass;
    pass = ok(g.start === s[b1].start && g.end === s[b1 + 1].end && g.blockIdx === 1,
      'group range spans first to last sentence for the highlight') && pass;

    // Groups never cross a block (paragraph) boundary.
    const lastOfB1 = VT().groupSentences(s, b1 + 1);
    pass = ok(lastOfB1.to === b1 + 1 || s[lastOfB1.to].blockIdx === 1, 'groups stop at the paragraph edge') && pass;

    // Chaining groups covers every sentence exactly once.
    let i = 0, covered = 0, guard = 0;
    while (i < s.length && guard++ < 50) {
      const gg = VT().groupSentences(s, i);
      covered += gg.to - gg.from + 1;
      i = gg.to + 1;
    }
    pass = ok(covered === s.length, 'group chain covers the chapter exactly', covered + '/' + s.length) && pass;

    // A very long single sentence: splitLong cuts it into `cont` pieces for the
    // device engine's utterance cap, and grouping must put them BACK together
    // so the neural engine never renders half a clause. One group, whole
    // sentence, and still bounded.
    const oneSentence = Array(7).fill('the wind counted coins against the shutters and nobody spoke').join(', ') + '.';
    const long = VT().segmentBlocks([{ t: 'p', c: oneSentence }], blockText);
    pass = ok(long.length > 1, 'the long sentence was split for the device cap', long.length + ' pieces') && pass;
    pass = ok(long.slice(1).every(x => x.cont), 'every piece after the first is flagged as a continuation') && pass;
    const gl = VT().groupSentences(long, 0);
    pass = ok(gl.to === long.length - 1, 'the split sentence comes back as ONE group', gl.from + '..' + gl.to) && pass;
    pass = ok(gl.text.length <= 700, 'rejoined groups stay under the continuation ceiling', gl.text.length) && pass;

    // Two such sentences in one paragraph must NOT chain into one giant group:
    // the continuation rule finishes a sentence, it does not merge sentences.
    const two = VT().segmentBlocks([{ t: 'p', c: oneSentence + ' ' + oneSentence }], blockText);
    const g2a = VT().groupSentences(two, 0);
    pass = ok(g2a.to === long.length - 1, 'a second long sentence starts a new group', g2a.from + '..' + g2a.to + ' of ' + (two.length - 1)) && pass;

    // A pathologically long sentence is still bounded — the ceiling wins over
    // the finish-the-sentence rule, so one generation can never run away.
    const huge = VT().segmentBlocks([{ t: 'p', c: Array(40).fill('the wind counted coins against the shutters and nobody spoke').join(', ') + '.' }], blockText);
    const gh = VT().groupSentences(huge, 0);
    pass = ok(gh.text.length <= 700, 'even a runaway sentence is capped', gh.text.length) && pass;

    // Light-novel dialogue: short complete lines stay their own sentences
    // instead of being swallowed as "fragments".
    const beats = VT().segmentBlocks([{ t: 'p', c: 'Ah! Mm. Eh? She went.' }], blockText);
    pass = ok(beats.length === 4, 'short but complete sentences are not merged away', beats.map(b => b.text).join(' | ')) && pass;
    return { name: 'grouping', pass };
  },

  async testNeuralPipeline() {
    let pass = true;
    // Fake ENGINE, real pipeline: generation resolves tiny silent WAVs, and
    // playback runs through the actual <audio> chain — group advance,
    // lookahead and the preparing debounce all execute for real.
    const ne = VT().neuralEngine;
    const orig = { ensureReady: ne.ensureReady, generate: ne.generate };
    let generated = 0;
    ne.ensureReady = function () {
      ne.worker = { postMessage: function () {}, terminate: function () {} };
      ne.readyPromise = Promise.resolve();
      ne.ready = true;
      return ne.readyPromise;
    };
    const wav = VT().encodeWav(new Float32Array(2400), 24000);   // 0.1 s of silence
    ne.generate = function () {
      generated++;
      return new Promise(r => setTimeout(() =>
        r(URL.createObjectURL(new Blob([wav], { type: 'audio/wav' }))), 25));
    };
    try {
      await freshOpen();
      V().toggle();
      await waitFor(() => V().state().index >= 3, 8000, 'cursor advanced across groups');
      pass = ok(V().state().playing, 'still playing after group hand-offs') && pass;
      pass = ok(generated >= 2, 'lookahead generated ahead of playback', 'calls=' + generated) && pass;
      pass = ok(!V().state().preparing, 'fast generations never showed "Preparing"') && pass;
      // Pausing a neural session keeps the place.
      VT().pause();
      const at = V().state().index;
      await pause(150);
      pass = ok(!V().state().playing && V().state().index === at, 'pause holds the group cursor') && pass;
    } finally {
      ne.ensureReady = orig.ensureReady;
      ne.generate = orig.generate;
      ne.ready = false; ne.readyPromise = null; ne.worker = null;
      endSession();
    }
    return { name: 'neural pipeline', pass };
  },

  // The lookahead and the cursor race for the same group. wavCache only knows
  // about FINISHED generations, so without in-flight dedupe the model renders
  // every group twice on a serial queue — the stutter people hear on a phone.
  async testNeuralDedupe() {
    let pass = true;
    neuralStub.restore();            // real generate, real cache, real lookahead
    const ne = VT().neuralEngine;
    const orig = { ensureReady: ne.ensureReady };
    const jobs = [];
    const wav = VT().encodeWav(new Float32Array(2400), 24000);   // 0.1 s
    // Real generate(), real wavCache, real lookahead; only the worker is fake.
    // It must be SLOWER than playback (400 ms per group against 100 ms of
    // audio) — that is the slower-than-realtime phone this guards, and the only
    // condition under which a prefetch is still in flight when the cursor
    // arrives. A fast fake would pass with or without the dedupe.
    ne.ensureReady = function () {
      ne.worker = {
        postMessage(m) {
          if (m.type !== 'generate') return;
          jobs.push(m.text);
          setTimeout(() => ne.settle(m.id, null, { type: 'audio', id: m.id, wav: wav.slice(0), seconds: 0.1 }), 400);
        },
        terminate() {},
      };
      ne.readyPromise = Promise.resolve();
      ne.ready = true;
      return ne.readyPromise;
    };
    try {
      await freshOpen();
      Store.prefs.set('voice.autoNext', false);
      V().toggle();
      await waitFor(() => V().state().index >= 4, 15000, 'cursor advanced across groups');
      VT().pause();
      await pause(250);
      const counts = {};
      jobs.forEach(t => { counts[t] = (counts[t] || 0) + 1; });
      const repeated = Object.keys(counts).filter(k => counts[k] > 1);
      pass = ok(jobs.length > 2, 'the worker was actually exercised', jobs.length + ' jobs') && pass;
      pass = ok(jobs.length === Object.keys(counts).length, 'one job per distinct group',
                jobs.length + ' jobs / ' + Object.keys(counts).length + ' groups') && pass;
      pass = ok(repeated.length === 0, 'no group is synthesised twice',
                repeated.length ? 'x' + counts[repeated[0]] + ' ' + repeated[0].slice(0, 60) : jobs.length + ' jobs, all distinct') && pass;
    } finally {
      neuralStub.resume();       // hand the engine back to the shared stub
      ne.ensureReady = orig.ensureReady;
      ne.ready = false; ne.readyPromise = null; ne.worker = null;
      ne.inFlight.clear();
      Store.prefs.set('voice.autoNext', true);
      endSession();
    }
    return { name: 'neural dedupe', pass };
  },

  // A paused or interrupted narrator must become idle without throwing away
  // the one expensive forward pass that ONNX Runtime cannot abort. Discarding
  // that promise makes resume render the same paragraph again, so the phone
  // pays twice for audio it only plays once.
  async testThermalLifecycle() {
    let pass = true;
    neuralStub.restore();
    const ne = VT().neuralEngine;
    const ch = VT().channel;
    const st = VT().state;
    const heldPlatform = window.Platform;
    const held = {
      worker: ne.worker, native: ne.native, activeId: ne.activeId,
      playing: st.playing, active: st.active, group: st.group,
      pool: ch.pool, slot: ch.slot, started: ch.started,
    };
    let releases = 0;
    try {
      // A native session owns hundreds of megabytes outside the worker. Killing
      // only the worker leaves that allocation resident after narration stops.
      window.Platform = window.Platform || {};
      window.Platform.kokoro = {
        available: function () { return true; },
        release: function () { releases++; return Promise.resolve(); },
      };
      ne.worker = { postMessage: function () {}, terminate: function () {} };
      ne.native = true;
      ne.dispose();
      ne.dispose();
      pass = ok(releases === 1,
        'disposing a native engine releases its native session exactly once',
        'release calls=' + releases) && pass;

      let failedWorkerStops = 0;
      const failedWorker = { terminate: function () { failedWorkerStops++; } };
      ne.worker = failedWorker;
      ne.disposeIfNotReady(failedWorker);
      pass = ok(failedWorkerStops === 1 && ne.worker === null,
        'a failed model initialization terminates its abandoned worker') && pass;

      // Model one unabortable job already inside ONNX Runtime. Pausing may drop
      // queued lookahead, but resume must join this same promise rather than
      // posting another generate for the same cache key.
      let calls = 0;
      let activeJob = 0;
      ne.worker = {
        postMessage: function (m) {
          // Deliberately do not announce `generating`: this is the race between
          // posting a job and receiving the worker's started notification.
          if (m.type === 'generate') { calls++; activeJob = m.id; }
        },
        terminate: function () {},
      };
      const wav = VT().encodeWav(new Float32Array(2400), 24000);
      const first = ne.generate('thermal:same-group', 'Same paragraph.', 'af_heart');
      first.catch(function () {});
      ne.cancelPending(true, 'thermal:same-group');
      const resumed = ne.generate('thermal:same-group', 'Same paragraph.', 'af_heart');
      pass = ok(first === resumed && calls === 1,
        'pause and resume reuse the active synthesis instead of rendering twice',
        'calls=' + calls) && pass;
      ne.settle(activeJob, null, { wav: wav.slice(0), seconds: 0.1, ms: 10, chars: 15 });
      await resumed;

      // Cancel, resume, then receive the old worker's delayed "generating"
      // notification. It must not become the active job again or the next pause
      // will preserve stale work and cancel the paragraph now being requested.
      let posted = [];
      ne.worker = {
        postMessage: function (m) { if (m.type === 'generate') posted.push(m.id); },
        terminate: function () {},
      };
      const stale = ne.generate('thermal:late-start', 'Late start.', 'af_heart');
      stale.catch(function () {});
      const staleId = posted[0];
      ne.cancelPending();
      await pause(0);                  // let inFlight forget the cancelled job
      const current = ne.generate('thermal:late-start', 'Late start.', 'af_heart');
      const currentId = posted[1];
      pass = ok(typeof ne.markGenerating === 'function',
        'worker start notifications are validated against pending jobs') && pass;
      if (typeof ne.markGenerating === 'function') {
        ne.markGenerating(staleId);    // arrives after cancel and resume
        pass = ok(ne.activeId !== staleId,
          'a late generating notification cannot resurrect a cancelled job') && pass;
        ne.markGenerating(currentId);
        ne.cancelPending(true, 'thermal:late-start'); // second pause
        const secondResume = ne.generate('thermal:late-start', 'Late start.', 'af_heart');
        pass = ok(secondResume === current && posted.length === 2,
          'the second pause still preserves the resumed current job',
          'generate calls=' + posted.length) && pass;
        ne.settle(currentId, null, { wav: wav.slice(0), seconds: 0.1, ms: 10, chars: 11 });
        await secondResume;

        // A result can arrive after its promise was cancelled. Even then the
        // matching active marker must be cleared rather than left stale.
        ne.activeId = staleId;
        ne.settle(staleId, null, { wav: wav.slice(0), seconds: 0.1 });
        pass = ok(ne.activeId === 0,
          'a late settlement clears its matching active marker') && pass;
      } else {
        current.catch(function () {});
        ne.cancelPending();
      }

      // Exercise the actual worker queue with one active job and two behind it.
      // The model line is replaced in-memory with a slow deterministic fake;
      // cancellation, queue filtering, pumping, WAV encoding and messages are
      // still the production worker code loaded from disk.
      const workerMessages = [];
      const workerSource = await fetch('../js/novel-voice-worker.js').then(function (r) { return r.text(); });
      const fakeModel = "let tts = { generate: async function () { "
        + "await new Promise(function (r) { setTimeout(r, 100); }); "
        + "return { audio: new Float32Array(2400), sampling_rate: 24000 }; } };";
      const queueWorkerUrl = URL.createObjectURL(new Blob([
        workerSource.replace('let tts = null;', fakeModel),
      ], { type: 'text/javascript' }));
      const queueWorker = new Worker(queueWorkerUrl, { type: 'module' });
      queueWorker.onmessage = function (ev) { workerMessages.push(ev.data || {}); };
      queueWorker.postMessage({ type: 'generate', id: 9101, text: 'one', voice: 'af_heart' });
      queueWorker.postMessage({ type: 'generate', id: 9102, text: 'two', voice: 'af_heart' });
      queueWorker.postMessage({ type: 'generate', id: 9103, text: 'three', voice: 'af_heart' });
      await waitFor(function () {
        return workerMessages.some(function (m) { return m.type === 'generating' && m.id === 9101; });
      }, 2000, 'worker begins first active job');
      queueWorker.postMessage({ type: 'cancel', preserveId: 9102 });
      await waitFor(function () {
        return workerMessages.some(function (m) { return m.type === 'error' && m.id === 9103; });
      }, 2000, 'worker drops unpreserved queued job');
      const firstDrop = workerMessages.filter(function (m) { return m.type === 'error'; }).map(function (m) { return m.id; });
      pass = ok(firstDrop.indexOf(9103) !== -1 && firstDrop.indexOf(9101) === -1 && firstDrop.indexOf(9102) === -1,
        'worker cancellation leaves the active job and preserveId, dropping other queued work',
        firstDrop.join(',')) && pass;
      // Cancel again while the first job remains active. The previously
      // preserved id must still be in the queue, so this second cancel reports
      // it; the active id is already shifted out and remains untouched.
      queueWorker.postMessage({ type: 'cancel' });
      await waitFor(function () {
        return workerMessages.some(function (m) { return m.type === 'error' && m.id === 9102; });
      }, 2000, 'worker later drops preserved queued job');
      pass = ok(!workerMessages.some(function (m) { return m.type === 'error' && m.id === 9101; }),
        'the active worker job remains untouched across both queue cancellations') && pass;
      queueWorker.terminate();
      URL.revokeObjectURL(queueWorkerUrl);

      // iOS can pause the element when another app takes the audio session.
      // The reader must mirror that state immediately so its two-second pump
      // cannot keep filling a silent queue while the phone heats in a pocket.
      const marker = {};
      const messages = [];
      ne.worker = { postMessage: function (m) { messages.push(m.type); }, terminate: function () {} };
      ch.pool = [marker]; ch.slot = 0; ch.started = true;
      st.active = true; st.playing = true; st.group = { from: 0, to: 0 };
      ch.handlePause(marker);
      pass = ok(!st.playing && st.group === null,
        'an unexpected audio pause stops playback and clears prefetch state') && pass;
      pass = ok(messages.indexOf('cancel') !== -1,
        'an unexpected audio pause drops queued inference work') && pass;
    } finally {
      ne.cancelPending();
      ne.worker = held.worker;
      ne.native = held.native;
      ne.activeId = held.activeId;
      ch.pool = held.pool; ch.slot = held.slot; ch.started = held.started;
      st.playing = held.playing; st.active = held.active; st.group = held.group;
      window.Platform = heldPlatform;
      neuralStub.resume();
    }
    return { name: 'thermal lifecycle', pass };
  },

  async testEfficiencyLifecycle() {
    let pass = true;
    neuralStub.restore();
    const t = VT(), ne = t.neuralEngine, oldWorker = window.Worker, oldPlatform = window.Platform;
    let terminated = 0;
    try {
      window.Worker = function () { this.postMessage = function () {}; this.terminate = function () { terminated++; }; };
      window.Platform = { isNative: true, memoryClass: function () { return 'high'; },
        kokoro: { available: function () { return true; }, release: function () { return Promise.resolve(); } } };
      t.resetCapability();
      pass = ok(t.neuralCapability().ok && t.neuralCapability().native, 'native startup does not require a browser inference heap') && pass;
      const ready = ne.ensureReady();
      const outcome = ready.then(function () { return 'ready'; }, function () { return 'cancelled'; });
      ne.dispose();
      pass = ok(await outcome === 'cancelled' && terminated === 1 && ne.worker === null, 'disposing during startup settles the promise and terminates the worker') && pass;
      ne.worker = { postMessage: function () {}, terminate: function () {} };
      const jobs = [];
      for (let i = 0; i < 4; i++) jobs.push(ne.generate('bounded:' + i, 'Short text.', 'am_michael').catch(function () {}));
      const overflow = await ne.generate('overflow', 'More text.', 'am_michael').then(function () { return false; }, function () { return true; });
      pass = ok(overflow && ne.pending.size === 4, 'generation backlog cannot exceed four jobs') && pass;
      ne.dispose(); await Promise.all(jobs);
      t.updateResources({ thermal: 'fair', lowPower: true });
      pass = ok(t.lookaheadSeconds() === 0, 'power pressure disables speculative depth') && pass;

      // Below break-even the phone keeps only the next group in flight, to stay
      // off the thermal ceiling. A computer has no such ceiling, and its wasm
      // engine is usually slower than playback, so that same rule produced a
      // wait before every sentence. Desktop keeps generating instead.
      // The breath between sentences. Generation latency used to supply it by
      // accident; on a GPU the next clip is ready before the current one ends.
      const gapSentences = t.state.sentences, gapRate = t.state.prefs.rate;
      try {
        t.state.sentences = [
          { blockIdx: 0, text: 'One.' }, { blockIdx: 0, text: 'Two.' }, { blockIdx: 1, text: 'Three.' },
        ];
        t.state.prefs.rate = 1;
        pass = ok(t.sentenceGapMs({ to: 0, blockIdx: 0, text: 'A finished sentence.' }) === 220,
          'a sentence end gets a breath') && pass;
        pass = ok(t.sentenceGapMs({ to: 1, blockIdx: 0, text: 'The last of the block.' }) === 420,
          'a paragraph end gets a longer one') && pass;
        pass = ok(t.sentenceGapMs({ to: 0, blockIdx: 0, text: 'a clause split here,' }) === 0,
          'a clause split is not a place to breathe') && pass;
        pass = ok(t.sentenceGapMs({ to: 0, blockIdx: 0, text: '“Quoted speech.”' }) === 220,
          'a closing quote still counts as the end') && pass;
        t.state.prefs.rate = 1.6;
        pass = ok(t.sentenceGapMs({ to: 0, blockIdx: 0, text: 'A finished sentence.' }) < 220,
          'reading faster asks for less air, not the same air stretched') && pass;
      } finally { t.state.sentences = gapSentences; t.state.prefs.rate = gapRate; }

      // The GPU path: desktop only, opt-in only, and fp32 because that is what
      // WebGPU runs. Single-core wasm measured 0.23x realtime on a computer,
      // which no amount of queue depth can rescue.
      const hadGpu = 'gpu' in navigator;
      let gpuStubbed = false;
      try {
        if (!hadGpu) { Object.defineProperty(navigator, 'gpu', { configurable: true, value: {} }); gpuStubbed = true; }
      } catch (e) { /* some engines refuse; the assertions below adapt */ }
      const gpuPresent = !!navigator.gpu;
      const platformBefore = window.Platform;
      const gpuPrefBefore = t.state.prefs.gpu;
      try {
        window.Platform = { tuning: function () { return { desktop: true }; } };
        t.state.prefs.gpu = true;
        if (gpuPresent) {
          pass = ok(t.neuralDevice() === 'webgpu', 'a desktop that opted in uses the GPU') && pass;
          pass = ok(t.neuralDtype('webgpu') === 'fp32', 'and the full-precision weights WebGPU needs') && pass;
        }
        t.state.prefs.gpu = false;
        pass = ok(t.neuralDevice() === 'wasm', 'a desktop that did not opt in stays on wasm') && pass;
        t.state.prefs.gpu = true;
        window.Platform = { tuning: function () { return { desktop: false }; } };
        pass = ok(t.neuralDevice() === 'wasm' && !t.gpuCapable(),
          'a phone never takes the GPU path, opted in or not') && pass;
        pass = ok(t.neuralDtype('wasm') === 'q8', 'and keeps the quantized bundle') && pass;
      } finally {
        window.Platform = platformBefore;
        t.state.prefs.gpu = gpuPrefBefore;
        if (gpuStubbed) { try { delete navigator.gpu; } catch (e) {} }
      }

      t.updateResources({ thermal: 'nominal', lowPower: false });
      const realPlatform = window.Platform;
      const slow = { ms: 1200, seconds: 1, chars: 15 };   // 0.83x realtime
      ne.noteSpeed(slow);
      try {
        window.Platform = { tuning: function () { return { desktop: false }; } };
        pass = ok(t.lookaheadSeconds() === 0, 'a slow phone still keeps only the next group in flight') && pass;
        window.Platform = { tuning: function () { return { desktop: true }; } };
        pass = ok(t.lookaheadSeconds() > 0, 'a slow desktop keeps generating instead of waiting per sentence') && pass;
      } finally { window.Platform = realPlatform; }

      // Heat throttles Natural voice; it must not stop it. A phone that sits at
      // serious while it is held — hotter still on a charger — would otherwise
      // never narrate again, because "wait until it cools" never arrives.
      ne.worker = { postMessage: function () {}, terminate: function () {} };
      const hotWorker = ne.worker;
      t.updateResources({ thermal: 'critical', lowPower: false });
      pass = ok(ne.worker === hotWorker, 'a critical thermal reading does not dispose the engine') && pass;
      pass = ok(t.thermalHot() && t.lookaheadSeconds() === 0 && t.prebufferTargetSeconds() === 0,
        'heat costs speculation instead: no lookahead, no startup prebuffer') && pass;
      // A memory warning is a different problem — the process is about to be
      // killed rather than slowed — and still releases the engine.
      t.updateResources({ thermal: 'critical', lowPower: false, memoryWarning: true });
      pass = ok(ne.worker === null, 'a memory warning still disposes the engine') && pass;
      for (let i = 0; i < 120; i++) ne.noteSpeed({ ms: 100, seconds: 1, chars: 10 });
      const d = t.voiceDiagnostics();
      pass = ok(d.events.length <= 100 && !JSON.stringify(d).includes('Short text.'), 'diagnostics are bounded and omit spoken text') && pass;
    } finally {
      t.updateResources({ thermal: 'nominal', lowPower: false });
      ne.dispose(); window.Worker = oldWorker; window.Platform = oldPlatform;
      t.resetCapability(); neuralStub.resume();
    }
    return { name: 'efficiency lifecycle', pass };
  },

  async all() {
    const tests = [
      T.testSegmentation, T.testNormalize, T.testWav, T.testPrefs,
      T.testListenButton, T.testTransportChromeSync, T.testPlayback, T.testFollow, T.testAutoAdvance,
      T.testUserNav, T.testCrashGuard, T.testMemoryTier, T.testEfficiencyLifecycle,
      T.testGrouping, T.testNeuralPipeline, T.testNeuralDedupe, T.testThermalLifecycle,
      T.testInitStall, T.testSheetsNeverStack, T.testGaplessPlayback, T.testNativeInference, T.testSystemNarrator, T.testCompactVoiceHint, T.testEscapedErrorIsNotFatal, T.testCapability, T.testGenerationSpeed, T.testLookaheadBuffer, T.testPrebuffer, T.testVoicePanelSyncs, T.testBundledWeights, T.testClose,

    log('FAIL  ' + headlessRun + ' threw: ' + (e && e.message));
    document.body.dataset.testResult = 'fail';
  });
}
</script>
