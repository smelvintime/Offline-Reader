<head>

<!-- Real persistence layer, same as the reader harness. -->
<script src="../js/config.js"></script>
<script src="../js/store.js"></script>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// Shims for the globals novel-reader.js expects from reader.js.
// ─────────────────────────────────────────────────────────────────────────────
const screens = new Set();
window.registerScreen = function (el) { if (el) screens.add(el); return el; };
window.showScreen = function (id) {
  screens.forEach(s => { if (s) s.style.display = 'none'; });
  const t = document.getElementById(id);
  if (t) { screens.add(t); t.style.display = 'block'; document.body.dataset.screen = id; }
};
window.proxyImageUrl = function (u) { return u; };
window.Catalogue = { goBack: function () {}, goHome: function () {} };

// ─────────────────────────────────────────────────────────────────────────────
// speechSynthesis stub — installed BEFORE novel-voice.js loads so every
// utterance in these tests is deterministic and silent. Real voices differ
// per machine; a test that actually talks is a test that flakes.
// ─────────────────────────────────────────────────────────────────────────────
const STUB_VOICES = [
  { name: 'Robo Compact',                       lang: 'en-US', voiceURI: 'v:robo',    localService: true,  default: true },
  { name: 'eSpeak English',                     lang: 'en-GB', voiceURI: 'v:espeak',  localService: true,  default: false },
  { name: 'Microsoft Aria Online (Natural) - English (United States)', lang: 'en-US', voiceURI: 'v:aria', localService: false, default: false },
  { name: 'Samantha (Enhanced)',                lang: 'en-US', voiceURI: 'v:sam',     localService: true,  default: false },
  { name: 'Google US English',                  lang: 'en-US', voiceURI: 'v:goog',    localService: false, default: false },
  { name: 'Daniel',                             lang: 'en-GB', voiceURI: 'v:daniel',  localService: true,  default: false },
  { name: 'Amélie',                             lang: 'fr-CA', voiceURI: 'v:amelie',  localService: true,  default: false },
];

const synthStub = {
  spoken: [],            // { text, rate, pitch, voice } in speak order
  live: null,            // the utterance currently "speaking"
  autoEnd: true,         // finish each utterance on a short timer
  endDelay: 4,
  getVoices: function () { return STUB_VOICES.slice(); },
  speak: function (u) {
    this.live = u;
    this.spoken.push({ text: u.text, rate: u.rate, pitch: u.pitch, voice: u.voice ? u.voice.voiceURI : null });
    if (this.autoEnd) {
      const self = this;
      setTimeout(function () {
        if (self.live !== u) return;      // cancelled meanwhile
        self.live = null;
        if (u.onend) u.onend({});
      }, this.endDelay);
    }
  },
  cancel: function () {
    const u = this.live;
    this.live = null;
    // Real engines report a cancelled utterance as an error event with
    // error='interrupted'; the module must NOT count that as a failure.
    if (u && u.onerror) u.onerror({ error: 'interrupted' });
  },
  pause: function () {}, resume: function () {},
  addEventListener: function () {},
  reset: function () { this.spoken = []; this.live = null; this.autoEnd = true; },
};
Object.defineProperty(window, 'speechSynthesis', { value: synthStub, configurable: true });

// The real SpeechSynthesisUtterance rejects assigning a plain object to its
// .voice property; a plain class keeps the stub voices assignable.
window.SpeechSynthesisUtterance = function (text) {
  this.text = String(text || '');
  this.voice = null; this.lang = ''; this.rate = 1; this.pitch = 1;
  this.onend = null; this.onerror = null;
};
</script>

<!-- Same relative order as index.html: voice before reader. -->
<script src="../js/novel-voice.js"></script>
<script src="../js/novel-reader.js"></script>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// Fixture — 3 chapters, deliberately small so cursor drills stay fast, with
// every block type the segmenter must handle.
// ─────────────────────────────────────────────────────────────────────────────
function makeChapter(n) {
  const blocks = [
    { t: 'h2', c: 'Chapter ' + n + ' — The Quiet Ledger' },
    { t: 'p',  c: 'The lantern guttered against the wind of chapter ' + n + '. She counted her breaths slowly.' },
    { t: 'p',  c: 'Dr. Harrow said nothing useful. Somewhere below, the city kept its own accounts in coin and rumour.' },
    { t: 'img', src: 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="60" height="40"></svg>'), alt: 'A plate' },
    { t: 'ul', items: ['First a coin was counted.', 'Then a rumour was spent.'] },
    { t: 'hr' },
    { t: 'p',  c: 'Nothing in the ledger explained the north gate.[3] It had stood open all winter.' },
  ];
  const words = blocks.reduce((a, b) => a + String(b.c || (b.items || []).join(' ') || '').split(/\s+/).filter(Boolean).length, 0);
  return { id: 'v-' + String(n).padStart(4, '0'), num: n, title: 'The Quiet Ledger', wordCount: words, blocks };
}
const CHAPTERS = [makeChapter(1), makeChapter(2), makeChapter(3)];

// A chapter long enough to be sure of spanning several pages at any sane
// viewport — the follow test needs real page turns to assert against.
const LONG_CHAPTER = (function () {
  const blocks = [{ t: 'h2', c: 'The Long Ledger' }];
  for (let i = 0; i < 30; i++) {
    blocks.push({ t: 'p', c: 'Paragraph ' + i + ' walked the terrace while the wind counted coins against the shutters. ' +
      'Nobody in the lower city asked the ledger why, and the ledger never once volunteered.' });
  }
  return { id: 'vl-0001', num: 1, title: 'The Long Ledger', wordCount: 900, blocks };
})();
const LONG_SERIES = {
  id: 'test:novel-voice-long', type: 'lightnovel', title: 'The Long Ledger', cover: null,
  status: 'ongoing', language: 'en', source: 'user', chapterCount: 1,
  chapters: [{ id: LONG_CHAPTER.id, num: 1, title: LONG_CHAPTER.title, wordCount: LONG_CHAPTER.wordCount }],
};

const SERIES = {
  id: 'test:novel-voice',
  type: 'lightnovel',
  title: 'A Test of Quiet Ledgers',
  cover: null,
  status: 'ongoing',
  language: 'en',
  source: 'user',
  chapterCount: CHAPTERS.length,
  chapters: CHAPTERS.map(c => ({ id: c.id, num: c.num, title: c.title, wordCount: c.wordCount })),
};

window.resolveChapterContent = function (series, chapter) {
  const src = CHAPTERS.find(c => c.id === chapter.id);
  if (!src) return Promise.reject(new Error('no such chapter: ' + chapter.id));
  return new Promise(res => setTimeout(() => res({
    seriesId: series.id, id: src.id, num: src.num, title: src.title,
    kind: 'text', blocks: src.blocks, wordCount: src.wordCount,
  }), 5));
};

// The reader's blockText contract, replicated for offset assertions. If this
// ever drifts from novel-reader.js the playback tests fail loudly, which is
// the point of asserting against it.
function blockText(b) {
  if (!b || typeof b !== 'object') return '';
  if (b.t === 'hr') return '';
  if (b.t === 'img') return typeof b.alt === 'string' ? b.alt : '';
  if (Array.isArray(b.items)) return b.items.join('');
  return b.c != null ? String(b.c) : '';
}

// ─────────────────────────────────────────────────────────────────────────────
// Harness plumbing
// ─────────────────────────────────────────────────────────────────────────────
const logEl = document.getElementById('log');
function log(s) { logEl.textContent += s + '\n'; logEl.scrollTop = logEl.scrollHeight; }
function ok(cond, name, extra) {
  const line = (cond ? 'PASS  ' : 'FAIL  ') + name + (extra != null ? '  [' + extra + ']' : '');
  log(line);
  return !!cond;
}
function waitFor(cond, ms, label) {
  const t0 = Date.now();
  return new Promise((res, rej) => {
    (function poll() {
      let v;
      try { v = cond(); } catch (e) { v = false; }
      if (v) return res(v);
      if (Date.now() - t0 > (ms || 3000)) return rej(new Error('timeout: ' + (label || 'condition')));
      setTimeout(poll, 15);
    })();
  });
}
function pause(ms) { return new Promise(r => setTimeout(r, ms)); }

const V = () => window.NovelVoice;
const VT = () => window.NovelVoice._test;

// ─────────────────────────────────────────────────────────────────────────────
// Neural stub — the module has one engine now, so this is what every playback
// test observes. Real generate(), real wavCache, real lookahead; only the
// worker is fake, and it answers with a few milliseconds of silence.
//
// `.spoken` is the text the engine was asked to say, in order — the same
// contract the speechSynthesis stub used to offer.
// ─────────────────────────────────────────────────────────────────────────────
const neuralStub = {
  spoken: [],
  delay: 4,
  real: null,
  suspended: false,
  install() {
    const ne = VT().neuralEngine;
    if (!this.real) this.real = { ensureReady: ne.ensureReady };
    const self = this;
    const wav = VT().encodeWav(new Float32Array(240), 24000);   // 10 ms
    ne.ensureReady = function () {
      ne.worker = {
        postMessage(m) {
          if (m.type !== 'generate') return;
          self.spoken.push(m.text);
          setTimeout(() => ne.settle(m.id, null,
            { type: 'audio', id: m.id, wav: wav.slice(0), seconds: 0.01 }), self.delay);
        },
        terminate() {},
      };
      ne.readyPromise = Promise.resolve();
      ne.ready = true;
      return ne.readyPromise;
    };
  },
  reset() {
    this.spoken = [];
    const ne = VT().neuralEngine;
    ne.dispose();
    ne.bundledCache = true;      // "the weights are in the app" — no download UI
    // A suite that has taken the engine over keeps it: freshOpen() runs inside
    // those suites too, and reinstalling here would clobber their own stub.
    if (!this.suspended) this.install();
  },
  // Suites that test ensureReady ITSELF — the stall watchdog, the crash-guard
  // arming, in-flight dedupe — need the real one back, and their own fake
  // worker underneath it.
  restore() {
    if (!this.real) return;
    this.suspended = true;
    const ne = VT().neuralEngine;
    ne.ensureReady = this.real.ensureReady;
    ne.dispose();
  },
  resume() {
    this.suspended = false;
    this.reset();
  },
};

async function freshOpen(opts) {
  // Ensure a clean session and default prefs unless a test overrides them.
  if (window.NovelReader.isOpen()) window.NovelReader.close({ navigate: false });
  neuralStub.reset();
  try { localStorage.removeItem('or.voiceGuard'); } catch (e) {}
  Store.prefs.set('voice.rate', 1);
  Store.prefs.set('voice.follow', (opts && 'follow' in opts) ? opts.follow : true);
  Store.prefs.set('voice.autoNext', (opts && 'autoNext' in opts) ? opts.autoNext : true);
  Store.prefs.set('voice.highlight', true);
  Store.prefs.set('novel.mode', (opts && opts.mode) || 'paged');
  await Store.deleteProgress(SERIES.id);
  await window.NovelReader.open({
    series: SERIES, chapter: SERIES.chapters[0],
    blocks: CHAPTERS[0].blocks, resume: null,
  });
  await pause(30);
}

function endSession() {
  if (V().isActive()) V().toggle();          // stop
  if (window.NovelReader.isOpen()) window.NovelReader.close({ navigate: false });
}

// ─────────────────────────────────────────────────────────────────────────────
// Tests
// ─────────────────────────────────────────────────────────────────────────────
const T = {
  report(r) { log((r.pass ? '── PASS: ' : '── FAIL: ') + r.name + ' ──'); },

  async open() { await freshOpen(); log('reader open'); },

  async testSegmentation() {
    let pass = true;
    const blocks = CHAPTERS[0].blocks;
    const s = VT().segmentBlocks(blocks, blockText);

    // Every sentence's text must equal the exact slice of its block's text —
    // offsets ARE anchors, so a one-off here is a progress bug later.
    pass = ok(s.every(x => x.text === blockText(blocks[x.blockIdx]).slice(x.start, x.end)),
      'every sentence equals its blockText slice') && pass;

    pass = ok(s.length === 9, 'sentence count for the fixture chapter', 'got ' + s.length) && pass;
    pass = ok(s[0].kind === 'heading' && s[0].blockIdx === 0, 'heading is its own spoken unit') && pass;
    pass = ok(!s.some(x => x.blockIdx === 3), 'img block is skipped') && pass;
    pass = ok(!s.some(x => x.blockIdx === 5), 'hr block is skipped') && pass;

    // "Dr. Harrow said nothing useful." must stay one sentence.
    const dr = s.filter(x => x.blockIdx === 2);
    pass = ok(dr.length === 2 && /^Dr\. Harrow said nothing useful\.$/.test(dr[0].text),
      'abbreviation "Dr." does not split the sentence', JSON.stringify(dr[0] && dr[0].text)) && pass;

    // List items segment on item boundaries with cumulative offsets.
    const li = s.filter(x => x.blockIdx === 4);
    pass = ok(li.length === 2 && li[0].text === 'First a coin was counted.' &&
      li[1].text === 'Then a rumour was spent.' && li[1].start === 'First a coin was counted.'.length,
      'list items keep their own boundaries and offsets') && pass;

    // A very long sentence is split at clauses, and every piece stays a slice.
    const long = [{ t: 'p', c: Array(30).fill('the lantern guttered against the wind, and nobody spoke of it').join(', ') + '.' }];
    const ls = VT().segmentBlocks(long, blockText);
    pass = ok(ls.length > 1 && ls.every(x => x.end - x.start <= 300),
      'overlong sentence splits under the utterance cap', 'pieces=' + ls.length) && pass;
    pass = ok(ls.every(x => x.text === blockText(long[0]).slice(x.start, x.end)),
      'split pieces still equal their slices') && pass;

    // sentenceIndexAt: the anchor mid-block-1 lands on the sentence containing it.
    const idx = VT().sentenceIndexAt(s, 1, blockText(blocks[1]).indexOf('She') + 2);
    pass = ok(s[idx].text === 'She counted her breaths slowly.', 'cursor seeds at the anchored sentence') && pass;

    return { name: 'segmentation', pass };
  },

  async testNormalize() {
    let pass = true;
    const n = VT().normalizeForSpeech;
    pass = ok(n('the gate.[3] It stood', 'device') === 'the gate. It stood', 'footnote markers stripped') && pass;
    pass = ok(n('salt — and iron', 'device') === 'salt, and iron', 'device: em-dash becomes a comma pause') && pass;
    pass = ok(n('salt — and iron', 'neural') === 'salt — and iron', 'neural: em-dash kept for the model') && pass;
    pass = ok(n('“curly” and ‘single’', 'device') === '"curly" and \'single\'', 'device: curly quotes straightened') && pass;
    pass = ok(n('a b\n c', 'neural') === 'a b c', 'whitespace collapsed') && pass;

    // Light-novel typography (§2.14): shapes an engine chokes on rather than
    // stylistic choices it can interpret.
    pass = ok(n('Wait…… what?', 'neural') === 'Wait… what?', 'ellipsis runs collapse to one beat', n('Wait…… what?', 'neural')) && pass;
    // No comma is added after an ellipsis, though it was tried: "…" carries
    // almost no learned duration where a comma carries the most certain one
    // there is. The beat landed on some ellipses and not others, because a
    // comma's duration is itself contextual, and an inconsistent pause reads
    // as a stumble rather than a breath. Kokoro's own "…" is at least the same
    // every time.
    pass = ok(n('Wait… what?', 'neural') === 'Wait… what?',
      'and nothing is added after one: an uneven beat is worse than none',
      n('Wait… what?', 'neural')) && pass;
    pass = ok(n('Well...... no', 'device') === 'Well… no', 'a run of dots is one ellipsis too', n('Well...... no', 'device')) && pass;
    pass = ok(n('He said――then stopped', 'neural') === 'He said—then stopped', 'a dash RUN becomes one em dash', n('He said――then stopped', 'neural')) && pass;
    pass = ok(n('He said――then stopped', 'device') === 'He said, then stopped', 'device turns the same run into a pause') && pass;
    pass = ok(n('「はい」', 'neural') === '“はい”', 'corner brackets read as quotation marks', n('「はい」', 'neural')) && pass;
    pass = ok(n('え！　なぜ？', 'neural') === 'え! なぜ?', 'full-width terminators become ASCII', n('え！　なぜ？', 'neural')) && pass;
    // The katakana prolonged sound mark LOOKS like a dash and is a letter.
    pass = ok(n('ラーメン', 'device') === 'ラーメン', 'U+30FC survives as part of the word', n('ラーメン', 'device')) && pass;
    return { name: 'normalize', pass };
  },

  async testWav() {
    let pass = true;
    const buf = VT().encodeWav(new Float32Array([0, 0.5, -0.5, 1]), 24000);
    const dv = new DataView(buf);
    const tag = o => String.fromCharCode(dv.getUint8(o), dv.getUint8(o + 1), dv.getUint8(o + 2), dv.getUint8(o + 3));
    pass = ok(tag(0) === 'RIFF' && tag(8) === 'WAVE' && tag(36) === 'data', 'RIFF/WAVE/data structure') && pass;
    pass = ok(dv.getUint32(24, true) === 24000, 'sample rate written') && pass;
    pass = ok(dv.getUint32(40, true) === 8, 'data length = samples × 2') && pass;
    pass = ok(dv.getInt16(44, true) === 0 && dv.getInt16(46, true) === 16383, 'PCM values scaled to int16') && pass;
    pass = ok(dv.getInt16(50, true) === 32767, 'full-scale sample clamps to 0x7fff') && pass;
    return { name: 'wav encode', pass };
  },

  async testPrefs() {
    let pass = true;
    Store.prefs.set('voice.rate', 99);
    Store.prefs.set('voice.pitch', -3);
    Store.prefs.set('voice.neuralVoice', 'af_nonexistent');
    const p = VT().readPrefs();
    pass = ok(p.rate === 1.6, 'rate clamps to its ceiling', p.rate) && pass;
    pass = ok(p.pitch === 0.8, 'pitch clamps to its floor', p.pitch) && pass;
    pass = ok(p.neuralVoice === 'af_heart', 'unknown narrator falls back') && pass;
    Store.prefs.set('voice.rate', 1);
    return { name: 'prefs validate', pass };
  },

  async testListenButton() {
    let pass = true;
    await freshOpen();
    const btn = document.querySelector('#novel-screen .nv-header button[aria-label="Listen"]');
    pass = ok(!!btn, 'Listen button renders in the reader header') && pass;
    pass = ok(btn && btn.getAttribute('aria-pressed') === 'false', 'starts unpressed') && pass;
    btn.click();
    await waitFor(() => V().isActive(), 1500, 'session starts');
    pass = ok(btn.getAttribute('aria-pressed') === 'true', 'pressed while narrating') && pass;
    pass = ok(!document.querySelector('#novel-screen .vc-bar[hidden]'), 'listen bar is visible') && pass;
    btn.click();
    pass = ok(!V().isActive() && btn.getAttribute('aria-pressed') === 'false', 'second tap stops the session') && pass;
    endSession();
    return { name: 'listen button', pass };
  },

  async testTransportChromeSync() {
    let pass = true;
    await freshOpen();
    V().toggle();
    await waitFor(() => V().state().playing, 1500, 'narration starts');

    const bar = document.querySelector('#novel-screen .vc-bar');
    const root = document.getElementById('novel-screen');
    pass = ok(!!bar && !bar.classList.contains('vc-bar-hidden'),
      'transport starts visible') && pass;

    document.querySelector('#novel-screen .nv-zone-mid').click();
    await pause(30);
    pass = ok(root.classList.contains('nv-chrome-hidden'),
      'centre tap dismisses the reader chrome') && pass;
    pass = ok(bar.classList.contains('vc-bar-hidden') && bar.getAttribute('aria-hidden') === 'true',
      'the same tap dismisses the transport') && pass;

    document.querySelector('#novel-screen .nv-zone-mid').click();
    await pause(30);
    pass = ok(!bar.classList.contains('vc-bar-hidden') && !bar.hasAttribute('aria-hidden'),
      'the next tap recalls the transport') && pass;
    pass = ok(!root.classList.contains('nv-chrome-hidden'),
      'with the reader chrome and page rail') && pass;

    await pause(3300);
    pass = ok(!bar.classList.contains('vc-bar-hidden'),
      'the transport has no independent early-dismiss timer') && pass;
    endSession();
    return { name: 'transport chrome sync', pass };
  },

  async testPlayback() {
    let pass = true;
    await freshOpen();
    V().toggle();
    await waitFor(() => neuralStub.spoken.length >= 3, 4000, 'three sentences spoken');

    pass = ok(V().state().active && V().state().playing, 'session active and playing') && pass;
    pass = ok(neuralStub.spoken[0].indexOf('Chapter 1') === 0, 'starts at the heading', neuralStub.spoken[0]) && pass;
    pass = ok(neuralStub.spoken[1].indexOf('The lantern guttered') === 0,
      'and moves on through the chapter', neuralStub.spoken[1]) && pass;

    // The highlight tracks the live sentence — range mode or block fallback.
    const st = V().state();
    if (st.highlightMode === 'range') {
      pass = ok(CSS.highlights.has('or-voice-sentence'), 'CSS highlight registered') && pass;
    } else {
      pass = ok(!!document.querySelector('#novel-screen .vc-speaking-block'), 'block highlight applied') && pass;
    }

    // Pause: utterance cancelled, position kept, interrupted ≠ error.
    const idxAtPause = V().state().index;
    VT().pause();
    await pause(30);
    pass = ok(!V().state().playing && V().state().active, 'pause keeps the session') && pass;
    pass = ok(V().state().errors === 0, 'our own cancel is not an engine error') && pass;

    // Skip while paused moves the cursor without speaking.
    const before = neuralStub.spoken.length;
    VT().skip(1);
    await pause(80);
    pass = ok(V().state().index === idxAtPause + 1, 'skip advances the cursor while paused') && pass;
    pass = ok(neuralStub.spoken.length === before, 'paused skip stays silent') && pass;

    // Resume picks up from the skipped-to sentence.
    VT().resume();
    await waitFor(() => neuralStub.spoken.length > before, 2000, 'resume speaks');
    pass = ok(V().state().playing, 'resumed') && pass;

    // Rate pref reaches the utterance.
    Store.prefs.set('voice.rate', 1.3);
    endSession();
    await freshOpen();
    Store.prefs.set('voice.rate', 1.3);
    V().toggle();
    // The rate lands on the <audio> element when the clip starts, which is a
    // worker round-trip after generate() is requested — so wait for the rate,
    // not for the request.
    await waitFor(() => {
      const a = VT().channel.current();
      return a && Math.abs(a.playbackRate - 1.3) < 0.001;
    }, 3000, 'spoke at the new rate');
    pass = ok(true, 'rate pref reaches the audio channel', VT().channel.current().playbackRate) && pass;
    Store.prefs.set('voice.rate', 1);
    endSession();
    return { name: 'playback', pass };
  },

  async testFollow() {
    let pass = true;
    // The long fixture: paged mode must genuinely paginate it.
    if (window.NovelReader.isOpen()) window.NovelReader.close({ navigate: false });
    Store.prefs.set('voice.follow', true);
    Store.prefs.set('voice.autoNext', false);
    Store.prefs.set('novel.mode', 'paged');
    await Store.deleteProgress(LONG_SERIES.id);
    await window.NovelReader.open({
      series: LONG_SERIES, chapter: LONG_SERIES.chapters[0],
      blocks: LONG_CHAPTER.blocks, resume: null,
    });
    await pause(30);
    pass = ok(window.NovelReader.state().pageCount > 1, 'fixture spans multiple pages',
      'pages=' + window.NovelReader.state().pageCount) && pass;

    V().toggle();
    await waitFor(() => neuralStub.spoken.length >= 1, 2000, 'started');
    VT().pause();

    // Walk the cursor forward until following has to turn a page.
    const total = V().state().sentenceCount;
    for (let i = V().state().index; i < total - 1 && window.NovelReader.state().page === 0; i++) {
      VT().skip(1); await pause(20);
    }
    const rs = window.NovelReader.state();
    pass = ok(rs.page > 0, 'follow turned the page to reach the spoken sentence',
      'page ' + rs.page + '/' + rs.pageCount) && pass;
    pass = ok(rs.anchor.blockIdx >= 1, 'reader anchor moved with the narration',
      'blockIdx=' + rs.anchor.blockIdx) && pass;

    // close() flushes progress synchronously through the reader's own path —
    // listening must have moved the persisted position like reading does.
    if (V().isActive()) V().toggle();
    window.NovelReader.close({ navigate: false });
    // The flush fires inside close() but the IndexedDB merge commits async —
    // poll rather than race it.
    let prog = null;
    const t0 = Date.now();
    while (Date.now() - t0 < 3000) {
      prog = await Store.getProgress(LONG_SERIES.id);
      if (prog && prog.blockIdx >= 1) break;
      await pause(40);
    }
    pass = ok(prog && prog.chapterId === LONG_CHAPTER.id && prog.blockIdx >= 1 && prog.charOffset > 0,
      'listening persisted reading progress', JSON.stringify(prog && { c: prog.chapterId, b: prog.blockIdx, o: prog.charOffset })) && pass;
    return { name: 'follow (paged)', pass };
  },

  async testCrashGuard() {
    let pass = true;
    await freshOpen();
    // A fresh guard — what a mid-utterance crash leaves behind — must
    // suppress autoplay: the session starts paused with the place seeded.
    localStorage.setItem('or.voiceGuard', String(Date.now()));
    V().toggle();
    await pause(150);
    pass = ok(V().state().active && !V().state().playing, 'guarded session starts paused') && pass;
    pass = ok(neuralStub.spoken.length === 0, 'no utterance auto-fired under the guard') && pass;
    // An explicit play re-arms it; two completed utterances stand it down.
    VT().resume();
    await waitFor(() => neuralStub.spoken.length >= 2, 3000, 'spoke after explicit play');
    await waitFor(() => !localStorage.getItem('or.voiceGuard'), 2000, 'guard cleared');
    pass = ok(true, 'two completed utterances clear the guard') && pass;
    endSession();

    // A clean pause is proof of life and clears an armed guard immediately.
    await freshOpen();
    V().toggle();
    await waitFor(() => neuralStub.spoken.length >= 1, 2000, 'started');
    VT().pause();
    pass = ok(!localStorage.getItem('or.voiceGuard'), 'pause clears the guard') && pass;
    endSession();

    // A guard written by an older build is a bare timestamp. That build could
    // only ever have armed it around an utterance, so it must read as 'speak'.
    localStorage.setItem('or.voiceGuard', String(Date.now()));
    pass = ok(VT().guardRead().phase === 'speak', 'a legacy bare timestamp reads as a speak crash') && pass;
    localStorage.removeItem('or.voiceGuard');
    pass = ok(VT().guardRead() === null, 'no guard reads as null') && pass;
    localStorage.setItem('or.voiceGuard', JSON.stringify({ t: Date.now() - 20 * 60 * 1000, phase: 'model' }));
    pass = ok(VT().guardRead() === null, 'a stale guard is not a crash') && pass;
    localStorage.removeItem('or.voiceGuard');

    // A crash while LOADING the model is not a crash while speaking. Retrying
    // the same load is retrying the crash, so the session drops to the device
    // voice and speaks instead of sitting there doing nothing.
    await freshOpen();
    localStorage.setItem('or.voiceGuard', JSON.stringify({ t: Date.now(), phase: 'model', device: 'wasm' }));
    V().toggle();
    await pause(300);
    pass = ok(V().state().active && !V().state().playing,
      'a load-phase crash starts paused instead of reloading the model') && pass;
    pass = ok(neuralStub.spoken.length === 0, 'and nothing is generated until asked again') && pass;
    localStorage.removeItem('or.voiceGuard');
    endSession();
    return { name: 'crash guard', pass };
  },

  // The symptom this guards: "Preparing the narrator…" forever. A worker the
  // OS killed for memory fires no error event, so nothing settled the promise
  // and the sheet sat on that line until the app was force-quit.
  async testInitStall() {
    let pass = true;
    neuralStub.restore();            // this suite IS the real ensureReady
    const ne = VT().neuralEngine;
    const origWorker = window.Worker;
    try {
      // A worker that starts, says nothing, and never comes back.
      window.Worker = function () {
        this.postMessage = function () {};
        this.terminate = function () {};
      };
      // Reach into the real ensureReady with a stall budget short enough to test.
      const started = Date.now();
      ne.dispose();
      const p = ne.ensureReady('wasm');
      pass = ok(!!localStorage.getItem('or.voiceGuard'), 'the guard is armed while the model loads') && pass;
      const armed = VT().guardRead();
      pass = ok(armed && armed.phase === 'model', 'armed as a model-phase crash', armed && armed.phase) && pass;

      let settled = null;
      p.then(() => { settled = 'resolved'; }, (e) => { settled = e; });
      await pause(400);
      pass = ok(settled === null, 'still waiting well before the stall budget') && pass;
      // Not waiting out the real 180 s here; the contract under test is that a
      // budget exists and that arming/clearing bracket it. The budget's value
      // is a constant, checked directly.
      pass = ok(VT().NEURAL_INIT_STALL_MS > 0 && VT().NEURAL_INIT_STALL_MS <= 300000,
        'the stall budget is finite and sane', VT().NEURAL_INIT_STALL_MS + 'ms') && pass;
      ne.dispose();
      await pause(50);

      // A hang has to say WHERE. Two rounds of this bug were spent guessing a
      // mechanism from a progress label that named no step, and both guesses
      // were wrong. The worker announces each step; a stall quotes the last one.
      const talker = [];
      window.Worker = function () {
        const w = this;
        this.postMessage = function () {
          // Announce a step, then go silent exactly as the real one did.
          setTimeout(() => w.onmessage && w.onmessage({
            data: { type: 'stage', stage: 'building the inference session' } }), 0);
        };
        this.terminate = function () { talker.push('terminated'); };
      };
      ne.dispose();
      const hang = ne.ensureReady('wasm');
      hang.catch(() => {});
      await pause(200);
      pass = ok(ne.stage === 'building the inference session',
        'the engine keeps the step the worker last reached', ne.stage) && pass;
      ne.dispose();
      await pause(50);
    } finally {
      neuralStub.resume();       // hand the engine back to the shared stub
      window.Worker = origWorker;
      localStorage.removeItem('or.voiceGuard');
      ne.ready = false; ne.readyPromise = null; ne.worker = null;
    }
    return { name: 'init stall', pass };
  },

  // The iPhone narrator. Added back after being removed, because the reason it
  // was removed was that it spoke through iOS's compact voice and nobody had
  // ever asked for a better one.
  async testSystemNarrator() {
    let pass = true;
    const V_ = V(), T = VT();
    const held = window.Platform ? window.Platform.speech : undefined;
    const spoken = [];
    let resolveNext = null;
    let readyCalls = 0;
    let origEnsureReady = null;
    try {
      window.Platform = window.Platform || {};
      window.Platform.speech = {
        available: function () { return true; },
        voices: function () {
          return Promise.resolve([
            { id: 'compact.en', name: 'Samantha', lang: 'en-US', quality: 'default' },
            { id: 'prem.en',    name: 'Ava',      lang: 'en-US', quality: 'premium' },
            { id: 'enh.en',     name: 'Evan',     lang: 'en-US', quality: 'enhanced' },
          ]);
        },
        speak: function (text, o) {
          spoken.push({ text: text, voiceId: o.voiceId, rate: o.rate });
          return new Promise(function (r) { resolveNext = function () { r(true); }; });
        },
        stop: function () { return Promise.resolve(); },
        pause: function () { return Promise.resolve(); },
        resume: function () { return Promise.resolve(); },
      };

      // Ranked best-first, so the good voices are not buried.
      // Count every attempt to load the model, not just every generation.
      readyCalls = 0;
      const ne0 = T.neuralEngine;
      origEnsureReady = ne0.ensureReady;
      ne0.ensureReady = function () { readyCalls++; return origEnsureReady.apply(this, arguments); };

      const ranked = T.rankSystemVoices(await window.Platform.speech.voices());
      pass = ok(ranked[0].quality === 'premium' && ranked[1].quality === 'enhanced'
                && ranked[2].quality === 'default',
        'voices sort premium, then enhanced, then compact',
        ranked.map(function (v) { return v.quality; }).join(',')) && pass;

      Store.prefs.set('voice.narrator', 'iphone');
      Store.prefs.set('voice.systemVoice', 'prem.en');
      await freshOpen();
      V_.toggle();
      await waitFor(() => spoken.length > 0, 4000, 'the OS narrator was asked to speak');
      pass = ok(spoken.length === 1, 'exactly one utterance is in flight at a time',
        spoken.length + ' spoken') && pass;
      pass = ok(spoken[0].voiceId === 'prem.en', 'through the chosen voice, not the default',
        spoken[0].voiceId) && pass;

      // Whole paragraphs, not sentences. Every utterance is a bridge round
      // trip the reader has to wait out, so the unit of speech is also the
      // unit of silence: one sentence at a time meant a gap after every
      // sentence, for a whole chapter.
      const firstSentence = V_.state().sentences
        ? V_.state().sentences[0] : null;
      pass = ok(spoken[0].text.length > 0, 'something was actually sent', String(spoken[0].text.length)) && pass;
      if (firstSentence) {
        pass = ok(spoken[0].text.length >= firstSentence.text.length,
          'and it is at least a whole sentence, never a fragment',
          spoken[0].text.length + ' vs sentence ' + firstSentence.text.length) && pass;
      }
      pass = ok(spoken[0].text.length <= 1600,
        'while still bounded, so one runaway paragraph cannot become the chapter',
        String(spoken[0].text.length)) && pass;

      // The first block is the chapter title, which is one short sentence, so
      // prove the merging directly on a paragraph shaped like real prose.
      const para = [];
      for (let i = 0; i < 6; i++) {
        para.push({ text: 'Sentence number ' + i + ' of an ordinary paragraph.',
                    blockIdx: 4, kind: 'p', start: i * 50, end: i * 50 + 49 });
      }
      para.push({ text: 'A sentence in the NEXT paragraph.',
                  blockIdx: 5, kind: 'p', start: 400, end: 433 });
      const sysG = T.groupSentences(para, 0, { target: 900, max: 1400, contMax: 1600 });
      pass = ok(sysG.to === 5, 'a whole paragraph goes out as one utterance',
        'merged ' + (sysG.to + 1) + ' of 6 sentences') && pass;
      pass = ok(sysG.blockIdx === 4 && sysG.text.indexOf('NEXT paragraph') === -1,
        'and it stops at the paragraph, so the pauses land where prose pauses') && pass;
      // The neural caps would have chopped the same paragraph into pieces.
      const neuG = T.groupSentences(para, 0, { target: 160, max: 300, contMax: 700 });
      pass = ok(neuG.to < sysG.to, 'which the generation-bound caps would not have done',
        'neural merged ' + (neuG.to + 1) + ', system merged ' + (sysG.to + 1)) && pass;
      pass = ok(!V_.state().preparing, 'and nothing is "preparing" — there is nothing to prepare') && pass;
      pass = ok(neuralStub.spoken.length === 0, 'the neural engine is never generating') && pass;
      // The bug this exists for: play() used to route every narrator through
      // ensureNeuralThenSpeak, so picking the instant voice still waited on
      // 88 MB of weights and still ended the session when the natural voice
      // could not run here. Counting generate() was not enough to see it —
      // the load is the cost, and the stub made the load free.
      pass = ok(readyCalls === 0,
        'and its 88 MB load is never even started', readyCalls + ' ensureReady calls') && pass;

      // The selected chip has to actually look selected. css/voice.css styles
      // `.vc-chip.vc-on`, and a plain `.on` would have been invisible.
      // Open the sheet the way a reader does. Relying on some other code path
      // to have called syncSheet() is how the previous version of this passed
      // while the panels were never synced on this narrator at all.
      const voiceBtn = document.querySelector('.vc-bar [aria-label="Voice settings"]');
      pass = ok(!!voiceBtn, 'the listen bar has a voice button to open') && pass;
      if (voiceBtn) voiceBtn.click();
      await pause(300);
      const narOn = document.querySelector('.vc-narrator-row .vc-chip.vc-on');
      pass = ok(!!narOn, 'the chosen narrator chip carries the class the CSS styles',
        narOn && narOn.textContent) && pass;
      pass = ok(narOn && narOn.dataset.narrator === 'iphone',
        'and it is the one actually selected', narOn && narOn.dataset.narrator) && pass;
      const sysRowEl = document.querySelector('.vc-system-row');
      pass = ok(sysRowEl && !sysRowEl.hidden, 'the iPhone voice panel is shown') && pass;
      const natRowEl = document.querySelector('.vc-neural-row');
      pass = ok(natRowEl && natRowEl.hidden,
        'and the natural-voice panel is out of the way') && pass;

      // The queue advances only when the utterance FINISHES, not when it starts.
      const before = V_.state().index;
      await pause(150);
      pass = ok(V_.state().index === before, 'the cursor waits for the voice to finish') && pass;
      resolveNext();
      await waitFor(() => spoken.length > 1, 4000, 'the next sentence follows');
      pass = ok(V_.state().index > before, 'and moves on once it has', String(V_.state().index)) && pass;
      endSession();
    } finally {
      if (origEnsureReady) VT().neuralEngine.ensureReady = origEnsureReady;
      if (held === undefined) { try { delete window.Platform.speech; } catch (e) {} }
      else window.Platform.speech = held;
      Store.prefs.set('voice.narrator', 'natural');
      Store.prefs.set('voice.systemVoice', '');
      endSession();
    }
    return { name: 'system narrator', pass };
  },

  // Only the compact voice installed is a settings problem with a one-minute
  // fix, and saying so is worth more than anything we can do in code.
  async testCompactVoiceHint() {
    let pass = true;
    const T = VT();
    const held = V().state;
    try {
      T.setSystemVoices([{ id: 'c', name: 'Samantha', lang: 'en-US', quality: 'default' }]);
      let hint = T.systemVoiceHint();
      pass = ok(/compact voice/.test(hint), 'names the compact voice as the culprit', hint) && pass;
      pass = ok(/Spoken Content/.test(hint), 'and says exactly where to fix it', hint) && pass;

      T.setSystemVoices([
        { id: 'a', name: 'Ava', lang: 'en-US', quality: 'premium' },
        { id: 'c', name: 'Samantha', lang: 'en-US', quality: 'default' },

      pass = ok(!/compact voice/.test(hint), 'and drops the scolding once one is installed', hint) && pass;

      T.setSystemVoices([]);

  // Two settings sheets must never be on screen at once, and a sheet must
  // always be closable.
  //
  // Reported from a phone: pressing the reader's Aa button put both sheets up
  // and the voice one could not be dismissed. Two things made that possible.
  // Both sheets sat at exactly the same z-index (scrim 40, sheet 50), so which
  // won was DOM insertion order and the voice scrim landed BELOW the reader's
  // sheet — tapping outside it could not dismiss it. And each close() trusted
  // a boolean rather than the screen, so one stale flag stranded a sheet that
  // nothing would take down again.
  async testSheetsNeverStack() {
    let pass = true;
    const V_ = V(), T = VT();
    try {
      await freshOpen();
      V_.toggle();                       // listen bar up
      await pause(250);

      const voiceSheet = document.querySelector('.vc-sheet');
      const voiceScrim = document.querySelector('.vc-scrim');
      const readerSheet = document.querySelector('#novel-screen .nv-sheet');
      const readerScrim = document.querySelector('#novel-screen .nv-scrim');
      pass = ok(!!(voiceSheet && voiceScrim && readerSheet), 'both sheets exist to compare') && pass;

      // The layering is a decision now, not DOM order.
      const z = function (n) { return parseInt(getComputedStyle(n).zIndex, 10); };
      pass = ok(z(voiceSheet) > z(readerSheet),
        'the voice sheet sits above the reader sheet',
        z(voiceSheet) + ' vs ' + z(readerSheet)) && pass;
      if (readerScrim) {
        pass = ok(z(voiceScrim) > z(readerSheet),
          'and its scrim covers the reader sheet, so tapping away dismisses it',
          z(voiceScrim) + ' vs ' + z(readerSheet)) && pass;
      }
      pass = ok(z(voiceScrim) < z(voiceSheet),
        'while staying under its own sheet', z(voiceScrim) + ' vs ' + z(voiceSheet)) && pass;

      // Mobile sheets used to hide with translateY(101%). That percentage is
      // relative to the sheet, so WebKit changed the travel distance as the
      // first layout resolved and visibly threw the sheet to the top before
      // dropping it back. Prove that changing a hidden sheet's height cannot
      // change its off-screen destination anymore.
      if (innerWidth < 720) {
        const root = document.querySelector('#novel-screen');
        const hiddenTravel = function (sheet, owner) {
          const oldHeight = sheet.style.height;
          const oldTransition = sheet.style.transition;
          const oldOwner = root.dataset.sheetOwner;
          root.dataset.sheetOwner = owner;
          sheet.style.transition = 'none';
          sheet.hidden = true;
          sheet.style.height = '180px';
          const first = new DOMMatrixReadOnly(getComputedStyle(sheet).transform).m42;
          sheet.style.height = '360px';
          const second = new DOMMatrixReadOnly(getComputedStyle(sheet).transform).m42;
          sheet.style.height = oldHeight;
          sheet.style.transition = oldTransition;
          if (oldOwner) root.dataset.sheetOwner = oldOwner;
          else delete root.dataset.sheetOwner;
          return [first, second];
        };
        const readerTravel = hiddenTravel(readerSheet, 'reader');
        const voiceTravel = hiddenTravel(voiceSheet, 'voice');
        pass = ok(Math.abs(readerTravel[0] - readerTravel[1]) < 0.5,
          'reader sheet has a height-independent mobile travel distance',
          readerTravel.join(' vs ')) && pass;
        pass = ok(Math.abs(voiceTravel[0] - voiceTravel[1]) < 0.5,
          'voice sheet has a height-independent mobile travel distance',
          voiceTravel.join(' vs ')) && pass;
      }

      // Opening one closes the other, in both orders.
      const aa = document.querySelector('#novel-screen [aria-label*="ettings"]');
      const vb = document.querySelector('.vc-bar [aria-label="Voice settings"]');
      pass = ok(!!(aa && vb), 'both buttons are reachable') && pass;

      // Aa must not wake the voice controller when voice does not own the
      // modal slot. This is the direct regression for a reader seeing voice
      // settings appear after tapping text settings.
      const realVoiceClose = V_.closeSheet;
      let idleVoiceCalls = 0;
      V_.closeSheet = function () { idleVoiceCalls++; };
      aa.click(); await pause(300);
      pass = ok(idleVoiceCalls === 0 && !readerSheet.hidden,
        'Aa opens reader settings without calling an idle voice menu',
        'voice calls=' + idleVoiceCalls) && pass;
      aa.click(); await pause(300);
      V_.closeSheet = realVoiceClose;

      vb.click(); await pause(300);
      pass = ok(!voiceSheet.hidden, 'voice opens') && pass;
      aa.click(); await pause(350);
      pass = ok(voiceSheet.hidden && !readerSheet.hidden,
        'pressing Aa replaces the voice sheet rather than stacking on it') && pass;
      pass = ok(document.querySelector('#novel-screen').dataset.sheetOwner === 'reader'
          && getComputedStyle(voiceSheet).display === 'none',
        'Aa gives the one modal slot to the reader and removes voice from layout',
        'owner=' + document.querySelector('#novel-screen').dataset.sheetOwner
          + ', voice display=' + getComputedStyle(voiceSheet).display
          + ', parent=' + (voiceSheet.parentElement && voiceSheet.parentElement.id)
          + ', matches=' + voiceSheet.matches("#novel-screen:not([data-sheet-owner='voice']) > .vc-sheet")) && pass;
      vb.click(); await pause(350);
      pass = ok(!voiceSheet.hidden && readerSheet.hidden,
        'and pressing Voice replaces the Aa sheet the same way') && pass;
      pass = ok(document.querySelector('#novel-screen').dataset.sheetOwner === 'voice'
          && getComputedStyle(readerSheet).display === 'none',
        'Voice gives the same slot to voice and removes the reader sheet from layout') && pass;

      // ── the dead screen ─────────────────────────────────────────────────
      //
      // Reported from a phone and never reproduced here: with narration
      // running, one tap on Aa put BOTH sheets up and left nothing that
      // answered a tap. Static analysis says one tap cannot open both, so the
      // trigger is still unknown — which is the reason to stop defending the
      // trigger and defend the OUTCOME. The reader's sheet makes the header
      // inert and the voice sheet layers above it, so between them they can
      // take every control off the screen; these force that state directly and
      // require the app to climb out of it.
      const header = document.querySelector('#novel-screen .nv-header')
        || document.querySelector('#novel-screen header');
      const inert = function () { return !!(header && header.inert); };

      voiceSheet.hidden = false; readerSheet.hidden = false;
      aa.click(); await pause(300);
      pass = ok(voiceSheet.hidden && !readerSheet.hidden,
        'Aa sweeps a stranded voice sheet rather than stacking under it') && pass;

      T.forceSheetFlag(false);                  // and now every flag lies
      voiceSheet.hidden = false; readerSheet.hidden = false;
      vb.click(); await pause(300);
      pass = ok(!voiceSheet.hidden && readerSheet.hidden,
        'and Voice recovers even when both flags disagree with the screen') && pass;

      V_.closeSheet(); await pause(150);
      if (readerScrim) { readerScrim.click(); await pause(150); }
      pass = ok(voiceSheet.hidden && readerSheet.hidden,
        'closing everything leaves nothing on screen') && pass;
      pass = ok(!inert(),
        'and the header answers taps again: an inert backdrop outliving the '
        + 'sheet that asked for it is the whole of "the screen will not move"') && pass;

      // The reader makes the backdrop inert for its own sheet, and must not
      // still be doing it while the voice sheet is the one on screen.
      vb.click(); await pause(250);
      pass = ok(!inert(), 'the voice sheet never leaves the header inert') && pass;
      V_.closeSheet(); await pause(150);

      // The condition that stranded a sheet: the flag says closed, the screen
      // says open. Closing has to believe the screen.
      T.forceSheetFlag(false);
      V_.closeSheet();
      pass = ok(voiceSheet.hidden,
        'a stale "already closed" flag cannot strand a visible sheet') && pass;
      endSession();
    } finally {
      endSession();
    }
    return { name: 'sheets never stack', pass };
  },

  // Gapless playback across group boundaries.
  //
  // One <audio> element reused for every clip meant every group boundary ran
  // the media load algorithm — fetch, parse, decode — AFTER the previous clip
  // had gone silent. At roughly three sentences per group that is a gasp every
  // three sentences, for a whole chapter.
  async testGaplessPlayback() {
    let pass = true;
    const T = VT();
    const ch = T.channel;
    try {
      ch.stop();
      ch.pool.length = 0;
      ch.slot = 0;
      ch.ensure();
      pass = ok(ch.pool.length === 2, 'there are two elements to alternate between',
        String(ch.pool.length)) && pass;

      // iOS blesses ELEMENTS, not the page. Missing the second blessing shows
      // up as every OTHER clip refusing to play, which is a miserable bug to
      // chase, so the gesture has to reach both.
      const silent = T.silentWavUrl();
      ch.bless(silent);
      pass = ok(ch.pool[0].src === silent && ch.pool[1].src === silent,
        'a user gesture blesses both, not just the one in use') && pass;

      // Priming puts the next clip in the SPARE, never the one playing.
      const a = 'blob:fake-a', b = 'blob:fake-b';
      ch.slot = 0;
      ch.primed = null;
      ch.pool[0].src = a;
      ch.prime(b);
      pass = ok(ch.primed === b, 'the next clip is primed', String(ch.primed)) && pass;
      pass = ok(ch.pool[1].src === b, 'into the spare element', ch.pool[1].src) && pass;
      pass = ok(ch.pool[0].src === a, 'leaving the playing element alone', ch.pool[0].src) && pass;

      // Playing the primed clip SWAPS to it rather than reloading. That swap
      // is the whole point: the decode was already paid for.
      ch.play(b, {});
      pass = ok(ch.slot === 1, 'playing the primed clip takes the spare', String(ch.slot)) && pass;
      pass = ok(ch.primed === null, 'and the prime is spent, not left stale') && pass;

      // An unprimed clip still plays, just without the head start.
      ch.play('blob:fake-c', {});
      pass = ok(ch.pool[ch.slot].src === 'blob:fake-c',
        'an unprimed clip still plays on the current element') && pass;

      // Rate reaches both, or a primed clip starts at the old speed.
      ch.setRate(1.35);
      pass = ok(ch.pool[0].playbackRate === 1.35 && ch.pool[1].playbackRate === 1.35,
        'speed reaches both, so a primed clip never starts at the old rate') && pass;
      pass = ok(ch.pool[0].defaultPlaybackRate === 1.35,
        'and survives the media load that assigning src runs') && pass;

      // Only the element actually playing may end a clip.
      let ends = 0;
      ch.onended = function () { ends++; };
      ch.pool[1 - ch.slot].dispatchEvent(new Event('ended'));
      pass = ok(ends === 0, 'the spare firing "ended" does not advance the reader',
        String(ends)) && pass;
      ch.pool[ch.slot].dispatchEvent(new Event('ended'));
      pass = ok(ends === 1, 'the playing one does', String(ends)) && pass;
    } finally {
      ch.stop();
      ch.setRate(1);
    }
    return { name: 'gapless playback', pass };
  },

  // Kokoro's forward pass, run natively.
  //
  // The model was never the problem — 88 MB of weights already ship, and a
  // bigger one would be slower. What was slow is where it ran. This proves the
  // swap happens, that the audio survives the bridge, and that a build without
  // the plugin is untouched.
  async testNativeInference() {
    let pass = true;
    const T = VT();
    const ne = T.neuralEngine;
    const held = window.Platform ? window.Platform.kokoro : undefined;
    try {
      // The exact encoding the Swift produces: clamped, rounded, little-endian
      // Int16, base64. If these two ever disagree the voice comes back as noise.
      const encode = function (floats) {
        let bin = '';
        for (let i = 0; i < floats.length; i++) {
          const c = Math.max(-1, Math.min(1, floats[i]));
          let v = Math.round(c * 32767);
          if (v < 0) v += 0x10000;
          bin += String.fromCharCode(v & 0xff, (v >> 8) & 0xff);
        }
        return btoa(bin);
      };
      const source = [0, 1, -1, 0.5, -0.5, 0.123456, 2, -2];
      const asked = [];
      window.Platform = window.Platform || {};
      window.Platform.kokoro = {
        available: function () { return true; },
        probe: function () { return Promise.resolve({ available: true, provider: 'coreml' }); },
        infer: function (ids, style, speed) {
          asked.push({ ids: ids, style: style, speed: speed });
          return Promise.resolve({ pcm: encode(source), sampleRate: 24000,
                                   provider: 'coreml', ms: 42 });
        },
        release: function () { return Promise.resolve(); },
      };

      pass = ok(T.nativeKokoro().available() === true,
        'the reader sees the native plugin when it is installed') && pass;

      // The decoder the worker uses, mirrored here. Clipping must clamp, and
      // the error must sit at one 16-bit step, not somewhere worse.
      const decode = function (b64) {
        const bin = atob(b64);
        const n = bin.length >> 1;
        const out = new Float32Array(n);
        for (let i = 0; i < n; i++) {
          let v = (bin.charCodeAt(i * 2 + 1) << 8) | bin.charCodeAt(i * 2);
          if (v >= 0x8000) v -= 0x10000;
          out[i] = v / 32768;
        }
        return out;
      };
      const back = decode(encode(source));
      let worst = 0;
      for (let i = 0; i < source.length; i++) {
        worst = Math.max(worst, Math.abs(Math.max(-1, Math.min(1, source[i])) - back[i]));
      }
      pass = ok(worst < 1 / 16384, 'audio survives the bridge within one 16-bit step',
        'max error ' + worst.toExponential(2)) && pass;
      pass = ok(Math.abs(back[6] - back[1]) < 1e-6 && Math.abs(back[7] - back[2]) < 1e-6,
        'and samples past full scale clamp rather than wrapping',
        back[6].toFixed(5) + ' / ' + back[7].toFixed(5)) && pass;

      // The engine line has to name which one ran. "Why is this slow" should
      // never need a rebuild to answer.
      ne.native = true; ne.provider = 'coreml';
      pass = ok(T.neuralCapabilityLine().indexOf('inference: native/coreml') !== -1,
        'the line says the forward pass went native', T.neuralCapabilityLine()) && pass;
      ne.native = false; ne.provider = '';
      pass = ok(T.neuralCapabilityLine().indexOf('inference: wasm') !== -1,
        'and says wasm when it did not', T.neuralCapabilityLine()) && pass;
    } finally {
      if (held === undefined) { try { delete window.Platform.kokoro; } catch (e) {} }
      else window.Platform.kokoro = held;
      ne.native = false; ne.provider = '';
    }
    return { name: 'native inference', pass };
  },

  // A background rejection is not a verdict on the session.
  //
  // An earlier version posted 'init-error' from the worker's global error and
  // unhandledrejection listeners, which the main thread treats as fatal. The
  // vendored bundle rejects a promise or two in the background and handles them
  // itself, so that killed working sessions -- and mislabelled them, since the
  // stage is wherever init had got to when the unrelated rejection surfaced.
  async testEscapedErrorIsNotFatal() {
    let pass = true;
    neuralStub.restore();
    const ne = VT().neuralEngine;
    const origWorker = window.Worker;
    try {
      // A worker that notes something escaping, then comes up perfectly fine.
      window.Worker = function () {
        const w = this;
        this.postMessage = function () {
          setTimeout(() => {
            w.onmessage && w.onmessage({ data: { type: 'stage', stage: 'looking for bundled weights' } });
            w.onmessage && w.onmessage({ data: { type: 'note', stage: 'looking for bundled weights',
              message: "undefined is not a function (near '...e of A...')" } });
            w.onmessage && w.onmessage({ data: { type: 'ready' } });
          }, 0);
        };
        this.terminate = function () {};
      };
      ne.dispose();
      let failed = null;
      await ne.ensureReady('wasm').catch(function (e) { failed = e; });
      pass = ok(failed === null, 'a noted rejection does not fail the load',
        failed && failed.message) && pass;
      pass = ok(ne.ready === true, 'and the engine comes up ready') && pass;
      pass = ok(/undefined is not a function/.test(ne.note),
        'the note is kept for the reader to report', ne.note) && pass;
      pass = ok(/during looking for bundled weights/.test(ne.note),
        'with the step it surfaced during, not the step that caused it', ne.note) && pass;
      pass = ok(VT().neuralCapabilityLine().indexOf('note:') !== -1,
        'and it reaches the line a reader can screenshot', VT().neuralCapabilityLine()) && pass;
      ne.dispose();
      pass = ok(ne.note === '', 'disposing clears it with the rest of the state') && pass;
      await pause(50);
    } finally {
      neuralStub.resume();
      window.Worker = origWorker;
      localStorage.removeItem('or.voiceGuard');
      ne.ready = false; ne.readyPromise = null; ne.worker = null; ne.note = '';
    }
    return { name: 'escaped error is not fatal', pass };
  },

  // The engine cannot run without shared wasm memory, and asking costs nothing.
  // Finding out after loading 88 MB is what "Preparing…" forever was.
  async testCapability() {
    let pass = true;
    const T = VT();
    const cap = T.neuralCapability();
    pass = ok(typeof cap.ok === 'boolean', 'capability resolves to a verdict', JSON.stringify(cap)) && pass;
    pass = ok(cap.sharedMemory === true, 'this browser grants shared wasm memory', 'sharedMemory=' + cap.sharedMemory) && pass;
    pass = ok(cap.ok === true, 'so the engine is offered here') && pass;
    pass = ok(cap.reason === '', 'and no reason is given when it can run', cap.reason) && pass;
    // The size is the answer, not the yes/no. A probe asking for one page got
    // "yes" on the very phone whose engine could not start, because the engine
    // asks for a 4 GB reservation and one page is not the same question.
    pass = ok(cap.heapPages >= 4096, 'the granted heap is recorded in pages', 'heapPages=' + cap.heapPages) && pass;
    // The line a reader sees names all three facts, so a screenshot is a bug report.
    const line = T.neuralCapabilityLine();
    for (const bit of ['shared wasm heap', 'SharedArrayBuffer', 'app:', 'weights']) {
      pass = ok(line.indexOf(bit) !== -1, 'the readable line names ' + bit, line) && pass;
    }
    // The screenshot that cost a rebuild showed a web-only download button on a
    // native build, with nothing in the line to say which of the two was wrong.
    pass = ok(line.indexOf('app: web') !== -1,
      'the line says whether the app thinks it is native', line) && pass;
    // Two different things were both called "native" here: whether this is the
    // native app, and whether the forward pass runs natively. One word for two
    // unrelated facts answers neither question.
    pass = ok(line.indexOf('inference:') !== -1 && line.indexOf('app:') !== -1,
      'and keeps the app and the inference as separate questions', line) && pass;
    // Stated, not inherited: this asserts the state-to-text mapping, and an
    // earlier suite's leftovers are not the state under test.
    const ne0 = T.neuralEngine;
    const heldCache = ne0.bundledCache, heldWhy = ne0.bundledWhy, heldStage = ne0.stage;
    ne0.bundledCache = null; ne0.bundledWhy = ''; ne0.stage = '';
    pass = ok(T.neuralCapabilityLine().indexOf('weights: not probed yet') !== -1,
      'and distinguishes an unprobed build from one missing its weights',
      T.neuralCapabilityLine()) && pass;
    ne0.bundledCache = false;
    pass = ok(T.neuralCapabilityLine().indexOf('weights: absent') !== -1,
      'from one whose weights really are missing', T.neuralCapabilityLine()) && pass;
    ne0.bundledCache = heldCache; ne0.bundledWhy = heldWhy; ne0.stage = heldStage;
    pass = ok(/shared wasm heap: \d+ MB/.test(line), 'and reports the heap in megabytes', line) && pass;
    // Memoised — WebAssembly.Memory allocation is not free to repeat.
    pass = ok(T.neuralCapability() === cap, 'the probe is memoised') && pass;

    // The line exists in the sheet but shows only when something is wrong.
    //
    // It used to be on screen whatever the verdict, because its absence was
    // ambiguous — "the engine is fine" and "this build predates the check"
    // looked identical, and telling them apart cost a round trip. That was
    // worth a wall of numbers over a settings panel while the engine was
    // failing every other run. It is not worth it on a build that works, and
    // the numbers are only ever read in the case where this still appears.
    await freshOpen();
    V().toggle();
    await pause(300);
    const panelLine = document.querySelector('.vc-sheet .vc-engine-line');
    pass = ok(!!panelLine, 'the sheet still carries an engine line') && pass;
    pass = ok(panelLine && panelLine.hidden,
      'hidden while the engine is healthy: a reader listening to a book is not '
      + 'reading heap sizes', panelLine && panelLine.textContent) && pass;

    // …and back the moment there is something to diagnose.
    const heldErr = VT().state.neuralError;
    try {
      VT().state.neuralError = 'forced for the test';
      V().openSheet ? V().openSheet() : document.querySelector('.vc-bar [aria-label="Voice settings"]').click();
      await pause(250);
      pass = ok(!panelLine.hidden, 'and shown again as soon as something fails') && pass;
      pass = ok(panelLine.textContent.indexOf('engine check') === 0,
        'still reading as the capability line, with every field it ever had',
        panelLine.textContent) && pass;
    } finally {
      VT().state.neuralError = heldErr;
    }
    endSession();

    // WebKit's answer, which is the one the native app gets: shared memory is
    // refused outside a cross-origin-isolated page. Chrome grants it anyway,
    // which is exactly why this bug was invisible in a browser.
    const realMemory = WebAssembly.Memory;
    try {
      WebAssembly.Memory = function () { throw new RangeError('Shared memory is only available in a cross-origin isolated context'); };
      T.resetCapability();
      const webkit = T.neuralCapability();
      pass = ok(webkit.ok === false, 'no shared memory -> the engine is not offered') && pass;
      pass = ok(/shared WebAssembly memory/.test(webkit.reason), 'and the reason names it', webkit.reason) && pass;
      pass = ok(T.neuralCapabilityLine().indexOf('heap: NONE') !== -1,
        'and the line says NONE rather than a size', T.neuralCapabilityLine()) && pass;
      pass = ok(/cross-origin isolated/.test(webkit.reason), 'and points at isolation', webkit.reason) && pass;
      pass = ok(/cross-origin isolated context/.test(webkit.memoryError || ''), 'the engine error is kept verbatim', webkit.memoryError) && pass;

      // The session must reach the device voice and actually speak, not hang.
      await freshOpen();
      V().toggle();
      await pause(300);
      pass = ok(!V().state().active, 'the session ends rather than sitting on Preparing') && pass;
      pass = ok(!V().state().preparing, 'and never enters the preparing state') && pass;
      pass = ok(neuralStub.spoken.length === 0, 'nothing was generated') && pass;
      endSession();

      // The case this whole change exists for: iOS grants shared memory, and
      // refuses the 4 GB reservation the engine asks for unprompted. The old
      // probe asked for one page, got a yes, and sent the reader to a
      // "Preparing the narrator" that never finished. Stepping down is the fix.
      WebAssembly.Memory = function (d) {
        if (d && d.maximum > 16384) throw new RangeError('could not allocate memory');
        return new realMemory(d);
      };
      T.resetCapability();
      const phone = T.neuralCapability();
      pass = ok(phone.ok === true, 'a phone that refuses 4 GB still gets the engine') && pass;
      pass = ok(phone.heapPages === 16384, 'stepped down to the largest heap it would grant',
        'heapPages=' + phone.heapPages) && pass;
      pass = ok(T.neuralCapabilityLine().indexOf('heap: 1024 MB') !== -1,
        'and the line reports what was granted, not what was asked',
        T.neuralCapabilityLine()) && pass;
      pass = ok(!phone.memoryError, 'a step-down is not an error', phone.memoryError) && pass;
    } finally {
      WebAssembly.Memory = realMemory;
      T.resetCapability();
    }
    return { name: 'capability', pass };
  },

  // "It read the chapter title and then stopped." A gap because the engine is
  // grinding and a gap because it died are the same silence, and nothing in
  // the app measured the difference until this.
  async testGenerationSpeed() {
    let pass = true;
    const ne = VT().neuralEngine;
    const held = ne.speed;
    try {
      ne.speed = null;
      pass = ok(VT().neuralCapabilityLine().indexOf('last group') === -1,
        'nothing is claimed before a group has been generated') && pass;

      // Slower than realtime: 8 s of compute for 2 s of speech.
      ne.noteSpeed({ ms: 8000, seconds: 2, chars: 300 });
      pass = ok(ne.speed.ratio === 0.25, 'the ratio is audio seconds per compute second',
        String(ne.speed.ratio)) && pass;
      pass = ok(ne.speed.ratio < 1, 'and below 1 means the reader outruns the engine') && pass;
      let line = VT().neuralCapabilityLine();
      pass = ok(line.indexOf('300 chars') !== -1, 'the line names the group size', line) && pass;
      pass = ok(line.indexOf('8.0s compute for 2.0s audio') !== -1,
        'and states both costs, not a single opaque number', line) && pass;
      pass = ok(line.indexOf('0.25× realtime') !== -1, 'and the ratio itself', line) && pass;

      // Faster than realtime: the healthy case.
      ne.noteSpeed({ ms: 1000, seconds: 5, chars: 120 });
      pass = ok(ne.speed.ratio === 5, 'a fast engine reports above 1', String(ne.speed.ratio)) && pass;

      // A generation that reported no timing must not invent one.
      ne.noteSpeed({ seconds: 3 });
      pass = ok(ne.speed.ratio === 5, 'a message with no timing leaves the last reading alone') && pass;

      // The caps follow the measurement. Fixed caps assume the engine outruns
      // the reader; on a device where it does not, a 300-character group is
      // eight times the wait of a chapter title, spent in silence.
      const caps = VT().neuralGroupCaps;
      ne.speed = null;
      const wide = caps();
      pass = ok(wide.max === 300, 'unmeasured: the original caps stand', JSON.stringify(wide)) && pass;

      ne.noteSpeed({ ms: 1000, seconds: 5, chars: 120 });     // 5x realtime
      pass = ok(caps().max === 300, 'a fast engine keeps its groups whole', JSON.stringify(caps())) && pass;

      ne.noteSpeed({ ms: 1000, seconds: 1, chars: 120 });     // 1.0x: break-even
      pass = ok(caps().max === 160, 'break-even is not enough slack for lookahead, so groups shrink',
        JSON.stringify(caps())) && pass;

      ne.noteSpeed({ ms: 10000, seconds: 2, chars: 300 });    // 0.2x: far behind
      const tight = caps();
      pass = ok(tight.max === 90, 'far behind: groups shrink hard so audio starts sooner',
        JSON.stringify(tight)) && pass;
      pass = ok(tight.target < tight.max && tight.max < tight.contMax,
        'and the three caps keep their ordering at every tier', JSON.stringify(tight)) && pass;

      // Purity is what lets the suite above drive grouping directly: an
      // explicit cap must beat whatever the last generation happened to say.
      const list = [
        { text: 'A'.repeat(50), blockIdx: 0, kind: 'p', start: 0, end: 50 },
        { text: 'B'.repeat(50), blockIdx: 0, kind: 'p', start: 50, end: 100 },
      ];
      const forced = VT().groupSentences(list, 0, { target: 160, max: 300, contMax: 700 });
      pass = ok(forced.to === 1, 'an explicit cap overrides the measured one', JSON.stringify(forced.to)) && pass;
      const measured = VT().groupSentences(list, 0);
      pass = ok(measured.to === 0, 'and the measured one applies when none is given',
        JSON.stringify(measured.to)) && pass;
    } finally {
      ne.speed = held;
    }
    return { name: 'generation speed', pass };
  },

  // How far ahead the generator has to stay, against what, and when chasing a
  // cushion stops being worth the heat.
  //
  // Three bugs met here. The speed check compared the raw generation ratio
  // against a fixed threshold, but the ratio is measured at speed 1 while the
  // reader drains the audio at their chosen rate, so a 1.34x engine looked
  // healthy to a reader running 2x who was really being served by a 0.67x one.
  // The lookahead was counted in GROUPS while the caps shrink groups on slow
  // devices, so the cushion got shorter exactly where it needed to get longer.
  // And then the seconds-based version chased its target unconditionally,
  // which on a device that cannot get ahead holds the CPU flat for a whole
  // chapter, heats the phone, and gets throttled for its trouble.
  async testLookaheadBuffer() {
    let pass = true;
    const ne = VT().neuralEngine;
    const st = VT().state;
    const held = {
      speed: ne.speed, generate: ne.generate, worker: ne.worker,
      sentences: st.sentences, chapterId: st.chapterId, rate: st.prefs.rate,
      fastStart: st.fastStart, groupCaps: st.groupCaps,
    };
    try {
      // ── the margin ──────────────────────────────────────────────────────
      // The phone's own numbers, off the engine-check line: 11.5 s of compute
      // for 15.4 s of audio.
      ne.noteSpeed({ ms: 11500, seconds: 15.4, chars: 300 });
      st.prefs.rate = 1;
      pass = ok(Math.abs(VT().neuralMargin() - 1.339) < 0.01,
        'at 1x the margin is the measured ratio', VT().neuralMargin().toFixed(3)) && pass;
      st.prefs.rate = 2;
      pass = ok(Math.abs(VT().neuralMargin() - 0.669) < 0.01,
        'at 2x the same engine is only half as far ahead', VT().neuralMargin().toFixed(3)) && pass;
      ne.speed = null;
      pass = ok(VT().neuralMargin() === 0, 'and unmeasured is 0, not a guess') && pass;

      // The caps follow the margin, not the ratio. Comparing the ratio alone
      // kept handing 160-character groups to a reader the engine could not
      // keep up with, which is the case that most needed them short.
      ne.noteSpeed({ ms: 11500, seconds: 15.4, chars: 300 });
      pass = ok(VT().neuralGroupCaps().max === 90,
        'a reader at 2x gets the caps a 0.67x engine needs',
        JSON.stringify(VT().neuralGroupCaps())) && pass;
      st.prefs.rate = 1;
      pass = ok(VT().neuralGroupCaps().max === 160,
        'and the same engine at 1x does not', JSON.stringify(VT().neuralGroupCaps())) && pass;

      // ── how deep a cushion is worth chasing ─────────────────────────────
      ne.speed = null;
      pass = ok(VT().lookaheadSeconds() === 0,
        'unmeasured begins with only the next clip') && pass;
      ne.noteSpeed({ ms: 1000, seconds: 3, chars: 60 });      // 3x realtime
      pass = ok(VT().lookaheadSeconds() === VT().NEURAL_LOOKAHEAD_SEC / 2,
        'an engine well ahead needs only enough cushion to absorb the wobble, '
        + 'and the idle it keeps is what stops the phone heating',
        String(VT().lookaheadSeconds())) && pass;
      ne.noteSpeed({ ms: 1000, seconds: 1.2, chars: 24 });    // 1.2x: ahead, barely
      pass = ok(VT().lookaheadSeconds() === VT().NEURAL_LOOKAHEAD_SEC,
        'barely ahead has less slack to spare, so it holds more',
        String(VT().lookaheadSeconds())) && pass;
      // Below break-even, speculative depth just keeps a phone pinned at full
      // load. The mandatory one-group minimum still overlaps the next clip.
      ne.noteSpeed({ ms: 1000, seconds: 1, chars: 20 });      // break-even
      pass = ok(VT().lookaheadSeconds() === 0,
        'and a device that cannot get ahead stops chasing speculative depth',
        String(VT().lookaheadSeconds())) && pass;

      // ── the estimate ────────────────────────────────────────────────────
      // 20 characters per second of audio, so 150 characters is 7.5 s.
      pass = ok(Math.abs(VT().estimateSeconds('x'.repeat(150)) - 7.5) < 0.01,
        'an ungenerated group is sized from what this voice actually produced',
        VT().estimateSeconds('x'.repeat(150)).toFixed(2)) && pass;
      ne.speed = null;
      pass = ok(VT().estimateSeconds('x'.repeat(150)) === 10,
        'and from a plain default before any group has been generated',
        String(VT().estimateSeconds('x'.repeat(150)))) && pass;

      // ── the buffer ──────────────────────────────────────────────────────
      // 20 characters per second of audio at 2x realtime. Sentences of 200
      // characters, so one sentence is one group under any cap and one group
      // is ten seconds: arithmetic a reader of this test can do in their head.
      ne.noteSpeed({ ms: 1000, seconds: 2, chars: 40 });
      const list = [];
      for (let i = 0; i < 12; i++) {
        list.push({ text: 'S'.repeat(200), blockIdx: 0, kind: 'p', start: i * 200, end: (i + 1) * 200 });
      }
      st.sentences = list;
      st.chapterId = 'lookahead-test';
      st.fastStart = false;
      ne.worker = {};                 // prefetchNeural only checks it is there
      const asked = [];
      ne.generate = function (key) { asked.push(key); return new Promise(function () {}); };

      const first = VT().groupSentences(list, 0);
      pass = ok(first.to === 0, 'one 200-character sentence is one group', JSON.stringify(first.to)) && pass;

      st.prefs.rate = 1;
      asked.length = 0;
      VT().prefetchNeural(first);
      // 2x realtime: 20 s of cushion at 10 s a group, and then the generator
      // is allowed to stop, which is the only reason the phone ever cools.
      pass = ok(asked.length === 2,
        'the queue is filled to seconds of playback, not to a group count',
        asked.length + ' groups for ' + VT().lookaheadSeconds() + 's') && pass;

      // Barely ahead: less slack, so a longer cushion, still bounded.
      ne.noteSpeed({ ms: 1000, seconds: 1.2, chars: 24 });    // 1.2x, same 20 cps
      asked.length = 0;
      VT().prefetchNeural(first);
      pass = ok(asked.length === 4, 'a thinner margin holds more in hand',
        asked.length + ' groups for ' + VT().lookaheadSeconds() + 's') && pass;

      // Break-even: only the mandatory next group is queued. That keeps the
      // overlap which prevents a seam without scheduling minutes of heat.
      ne.noteSpeed({ ms: 1000, seconds: 1, chars: 20 });
      asked.length = 0;
      VT().prefetchNeural(first);
      pass = ok(asked.length === 1,
        'and below it only the next group is queued',
        asked.length + ' groups') && pass;

      // Already generated, or already queued: counted toward the cushion,
      // never asked for again. The worker is a serial queue, so a duplicate
      // does not just waste time, it renders in front of audio that is waiting.
      ne.noteSpeed({ ms: 1000, seconds: 1.2, chars: 24 });
      asked.length = 0;
      VT().prefetchNeural(first);
      const repeat = asked.slice();
      ne.wavCache.set(repeat[0], 'blob:already-generated');
      ne.clipSeconds.set(repeat[0], 10);
      asked.length = 0;
      VT().prefetchNeural(first);
      pass = ok(asked.indexOf(repeat[0]) === -1, 'a cached group is not generated twice') && pass;
      pass = ok(asked.length === 3,
        'and it still counts toward the cushion, so the queue does not overfill',
        asked.length + ' new groups') && pass;
      ne.wavCache.delete(repeat[0]);
      ne.clipSeconds.delete(repeat[0]);

      // The end of the chapter is not a reason to spin.
      const last = VT().groupSentences(list, 11);
      asked.length = 0;
      VT().prefetchNeural(last);
      pass = ok(asked.length === 0, 'nothing is queued past the last sentence') && pass;

      // ── the first group after a tap ─────────────────────────────────────
      // Nothing is generated behind it, so its whole length is a wait someone
      // sits through. It gets its own caps; the lookahead behind it does not,
      // or every clip generated during the wait would be keyed to boundaries
      // that stop existing the moment the caps go back to normal.
      const prose = [
        { text: 'Short one.', blockIdx: 0, kind: 'p', start: 0, end: 10 },
        { text: 'B'.repeat(140), blockIdx: 0, kind: 'p', start: 10, end: 150 },
        { text: 'C'.repeat(140), blockIdx: 0, kind: 'p', start: 150, end: 290 },
      ];
      const fast = VT().groupSentences(prose, 0, VT().FAST_START_CAPS);
      pass = ok(fast.to === 0, 'the fast-start group is the one sentence and no more',
        JSON.stringify(fast.text)) && pass;
      const normal = VT().groupSentences(prose, 0);
      pass = ok(normal.to > fast.to, 'where the normal caps would have merged more',
        normal.to + ' vs ' + fast.to) && pass;
      pass = ok(VT().FAST_START_CAPS.contMax > VT().FAST_START_CAPS.max,
        'and a split sentence is still finished rather than cut at a comma') && pass;

      // Once lookahead has started, its grouping boundaries are a cache
      // contract. Per-clip timing is noisy; changing tiers after clips are
      // queued makes playback request different keys and synthesize again.
      const stable = [
        { text: 'A'.repeat(50), blockIdx: 0, kind: 'p', start: 0, end: 50 },
        { text: 'B'.repeat(50), blockIdx: 0, kind: 'p', start: 50, end: 100 },
        { text: 'C'.repeat(50), blockIdx: 0, kind: 'p', start: 100, end: 150 },
        { text: 'D'.repeat(50), blockIdx: 0, kind: 'p', start: 150, end: 200 },
      ];
      st.sentences = stable;
      st.groupCaps = { target: 90, max: 160, contMax: 400 };
      ne.noteSpeed({ ms: 1000, seconds: 3, chars: 60 });
      const beforeNoise = VT().neuralGroupAt(0);
      ne.noteSpeed({ ms: 3000, seconds: 1, chars: 20 });
      const afterNoise = VT().neuralGroupAt(0);
      pass = ok(beforeNoise.to === 1 && afterNoise.to === 1,
        'queued group boundaries stay fixed when later timing samples cross tiers',
        beforeNoise.to + ' / ' + afterNoise.to) && pass;
    } finally {
      ne.speed = held.speed;
      ne.generate = held.generate;
      ne.worker = held.worker;
      st.sentences = held.sentences;
      st.chapterId = held.chapterId;
      st.prefs.rate = held.rate;
      st.fastStart = held.fastStart;
      st.groupCaps = held.groupCaps;
    }
    return { name: 'lookahead buffer', pass };
  },

  // Paying a chapter's deficit up front instead of a second at a time.
  //
  // Below break-even no scheduling helps: over a chapter of D seconds the
  // engine produces margin x D and the reader consumes D, so it ends short by
  // (1 - margin) x D however the work is ordered. That quantity is fixed, and
  // the only real choice is when it gets paid. These pin the arithmetic that
  // decides how long the wait is, and the cases where there should be no wait
  // at all.
  async testPrebuffer() {
    let pass = true;
    const ne = VT().neuralEngine;
    const st = VT().state;
    const held = {
      speed: ne.speed, sentences: st.sentences, chapterId: st.chapterId,
      rate: st.prefs.rate, index: st.index, prebuffer: st.prebuffer,
      playing: st.playing, worker: ne.worker, generate: ne.generate,
      fastStart: st.fastStart, group: st.group, groupCaps: st.groupCaps,
      channelPlay: VT().channel.play,
    };
    try {
      // 20 characters per second of audio. 200 sentences of 200 characters is
      // 40,000 characters, so 2000 seconds of speech at 1x.
      const list = [];
      for (let i = 0; i < 200; i++) {
        list.push({ text: 'S'.repeat(200), blockIdx: i, kind: 'p', start: 0, end: 200 });
      }
      st.sentences = list;
      st.chapterId = 'prebuffer-test';
      st.index = 0;
      st.prefs.rate = 1;
      st.prebuffer = null;

      ne.noteSpeed({ ms: 1000, seconds: 2, chars: 40 });     // 2x realtime, 20 cps
      pass = ok(Math.abs(VT().chapterSecondsLeft(0) - 2000) < 1,
        'what is left of the chapter is measured in playback seconds',
        VT().chapterSecondsLeft(0).toFixed(0) + 's') && pass;
      st.prefs.rate = 2;
      pass = ok(Math.abs(VT().chapterSecondsLeft(0) - 1000) < 1,
        'and a faster reader gets through it in half the time',
        VT().chapterSecondsLeft(0).toFixed(0) + 's') && pass;
      st.prefs.rate = 1;

      // ── no deficit, no wait ─────────────────────────────────────────────
      pass = ok(VT().prebufferTargetSeconds() === 0,
        'an engine that keeps up is never made to buffer') && pass;
      ne.noteSpeed({ ms: 1000, seconds: 1.1, chars: 22 });   // 1.1x: still ahead
      pass = ok(VT().prebufferTargetSeconds() === 0,
