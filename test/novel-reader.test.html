<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>NovelReader — test harness</title>

  <!-- Production load order: the app's base skin first, then the reader skin.
       novel.css is scoped under #novel-screen and must survive both. -->
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../css/novel.css">
  <style>
    /* The harness' own chrome. Deliberately outside #novel-screen. */
    #harness {
      position: fixed; z-index: 9000; top: 0; left: 0; right: 0;
      display: flex; flex-wrap: wrap; gap: 4px; padding: 4px;
      background: #111; border-bottom: 1px solid #333;
      font: 12px/1 ui-monospace, Menlo, Consolas, monospace;
    }
    #harness.off { display: none; }
    #harness button { padding: 4px 8px; background: #222; color: #eee; border: 1px solid #444; border-radius: 4px; cursor: pointer; }
    #log { position: fixed; z-index: 9000; bottom: 0; left: 0; right: 0; max-height: 30vh; overflow: auto;
           background: #000c; color: #9f9; font: 11px/1.4 ui-monospace, monospace; padding: 4px; white-space: pre-wrap; }
    #log.off { display: none; }
  </style>
</head>
<body>

<div id="harness">
  <button onclick="T.open()">open</button>
  <button onclick="T.mode('paged')">paged</button>
  <button onclick="T.mode('chapter')">chapter</button>
  <button onclick="T.mode('infinite')">infinite</button>
  <button onclick="T.dump()">state</button>
  <button onclick="T.testLoadedDiagnostics().then(T.report)">lru defaults</button>
  <button onclick="T.testLru().then(T.report)">lru drill</button>
  <button onclick="T.testImgPinning().then(T.report)">img pinning</button>
  <button onclick="T.testPresets().then(T.report)">presets apply</button>
  <button onclick="T.testPresetSaveLoad().then(T.report)">presets save/load</button>
  <button onclick="T.testPresetNameXss().then(T.report)">presets xss</button>
  <button onclick="T.testThoughtsCta().then(T.report)">thoughts cta</button>
  <button onclick="T.testHomeButton().then(T.report)">home button</button>
</div>
<div id="log"></div>

<!-- Real persistence layer — progress assertions go through the real IndexedDB. -->
<script src="../js/config.js"></script>
<script src="../js/store.js"></script>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// Shims for the two globals novel-reader.js expects from reader.js. The real
// reader.js is not loadable here: it reaches for a dozen elements in index.html
// at parse time. These are behaviourally identical for our purposes.
// ─────────────────────────────────────────────────────────────────────────────
const screens = new Set();
window.registerScreen = function (el) { if (el) screens.add(el); return el; };
window.showScreen = function (id) {
  screens.forEach(s => { if (s) s.style.display = 'none'; });
  const t = document.getElementById(id);
  if (t) { screens.add(t); t.style.display = 'block'; document.body.dataset.screen = id; }
};
// Record every URL that goes through the gateway helper, so the test can prove
// image blocks are proxied rather than hot-linked.
window.__proxied = [];
window.proxyImageUrl = function (u) {
  window.__proxied.push(u);
  if (/^(data:|blob:)/i.test(u) || !/^https?:/i.test(u)) return u;
  return u + (u.indexOf('?') === -1 ? '?' : '&') + 'via=proxy';
};

// Catalogue is absent; close() falls back to showScreen('home-screen') which is
// a no-op here. Record the calls so the tests can assert teardown happened and
// that the home button routes through goHome, never goBack.
window.__navigatedAway = 0;
window.__wentHome = 0;
window.Catalogue = {
  goBack: function () { window.__navigatedAway++; },
  goHome: function () { window.__wentHome++; },
};

// ─────────────────────────────────────────────────────────────────────────────
// Fixture — 6 chapters × ~40 blocks of deterministic prose.
//
// Deterministic so a failing assertion is reproducible: a seeded LCG picks the
// sentence shapes, not Math.random.
// ─────────────────────────────────────────────────────────────────────────────
function lcg(seed) { let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }

const WORDS = ('the lantern guttered against a wind that carried salt and iron across the terrace ' +
  'she counted her breaths the way her teacher had taught her slowly and without hope ' +
  'somewhere below the city kept its own accounts in coin and rumour and the occasional quiet knife ' +
  'nothing in the ledger explained why the north gate had been left standing open all winter').split(' ');

function sentence(rnd, minW, maxW) {
  const n = Math.floor(minW + rnd() * (maxW - minW));
  const out = [];
  for (let i = 0; i < n; i++) out.push(WORDS[Math.floor(rnd() * WORDS.length)]);
  out[0] = out[0][0].toUpperCase() + out[0].slice(1);
  return out.join(' ') + '.';
}

// A 3:2 plate as an inline data URI — no network, so the "image loaded" path is
// deterministic even with the radio off.
const OK_IMG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400">' +
  '<rect width="600" height="400" fill="#4f46e5"/>' +
  '<circle cx="300" cy="200" r="120" fill="#fbfaf8"/></svg>');

function makeChapter(n) {
  const rnd = lcg(1000 + n * 77);
  const blocks = [];
  blocks.push({ t: 'h2', c: 'Chapter ' + n + ' — The Ledger of Small Debts' });
  for (let i = 0; i < 38; i++) {
    const roll = rnd();
    if (i === 9)       blocks.push({ t: 'h3', c: 'An interruption' });
    else if (i === 17) blocks.push({ t: 'blockquote', c: sentence(rnd, 12, 24) });
    else if (i === 22) blocks.push({ t: 'hr' });
    else if (i === 26) blocks.push({ t: 'ul', items: [sentence(rnd, 4, 8), sentence(rnd, 4, 8), sentence(rnd, 4, 8)] });
    else if (i === 30) blocks.push({ t: 'note', c: 'Translator’s note: ' + sentence(rnd, 8, 14) });
    else if (i === 33) blocks.push({ t: 'pre', c: 'ledger[' + n + '] = {\n  gate: "open",\n  since: "winter"\n};' });
    else if (i === 35) blocks.push({ t: 'weird-unknown-type', c: 'This block type is not in the spec and must render as a paragraph.' });
    // XSS boundary: a hostile source site putting markup in a content string
    // must end up as literal characters, never as nodes.
    else if (i === 12) blocks.push({ t: 'p', c: 'HOSTILE <img src=x onerror="window.__pwned=1"> <script>window.__pwned=1<\/script> end.' });
    // Two illustrations: one that resolves (inline SVG data URI) and one that
    // cannot, so the collapse-on-error path is exercised for real.
    else if (i === 14) blocks.push({ t: 'img', src: OK_IMG, alt: 'A working plate' });
    else if (i === 15) blocks.push({ t: 'img', src: 'https://example.invalid/nope.png', alt: 'A dead plate' });
    // A scheme that must never reach an <img src>.
    else if (i === 16) blocks.push({ t: 'img', src: 'javascript:window.__pwned=1', alt: 'Hostile scheme' });
    else {
      const s = [];
      const count = 3 + Math.floor(roll * 3);
      for (let k = 0; k < count; k++) s.push(sentence(rnd, 10, 26));
      blocks.push({ t: 'p', c: s.join(' ') });
    }
  }
  const words = blocks.reduce((a, b) => a + String(b.c || (b.items || []).join(' ') || '').split(/\s+/).filter(Boolean).length, 0);
  return {
    id: 'c-' + String(n).padStart(4, '0'),
    num: n,
    title: 'The Ledger of Small Debts',
    wordCount: words,
    blocks: blocks,
  };
}

const CHAPTERS = [];
for (let i = 1; i <= 6; i++) CHAPTERS.push(makeChapter(i));

const SERIES = {
  id: 'test:novel-reader',
  type: 'lightnovel',
  title: 'A Test of Small Debts',
  cover: null,
  status: 'ongoing',
  language: 'en',
  source: 'user',
  chapterCount: CHAPTERS.length,
  chapters: CHAPTERS.map(c => ({ id: c.id, num: c.num, title: c.title, wordCount: c.wordCount })),
};

// ─────────────────────────────────────────────────────────────────────────────
// Second fixture — 15 lean chapters for the state.loaded LRU tests. The main
// fixture stays at 6 on purpose (other specs depend on its exact shape), and
// 6 chapters can never exceed a realistic cap. Prose is short so a forward
// scroll through eight chapters costs frames, not seconds.
// ─────────────────────────────────────────────────────────────────────────────
function makeLruChapter(n) {
  const rnd = lcg(9000 + n * 131);
  const blocks = [{ t: 'h2', c: 'Chapter ' + n + ' — The Bounded Ledger' }];
  for (let i = 0; i < 8; i++) {
    blocks.push({ t: 'p', c: sentence(rnd, 14, 24) + ' ' + sentence(rnd, 14, 24) + ' ' + sentence(rnd, 14, 24) });
  }
  const words = blocks.reduce((a, b) => a + String(b.c || '').split(/\s+/).filter(Boolean).length, 0);
  return { id: 'l-' + String(n).padStart(4, '0'), num: n, title: 'The Bounded Ledger', wordCount: words, blocks };
}
const LRU_CHAPTERS = [];
for (let i = 1; i <= 15; i++) LRU_CHAPTERS.push(makeLruChapter(i));

const LRU_SERIES = {
  id: 'test:novel-lru',
  type: 'lightnovel',
  title: 'A Test of Bounded Memory',
  cover: null,
  status: 'ongoing',
  language: 'en',
  source: 'user',
  chapterCount: LRU_CHAPTERS.length,
  chapters: LRU_CHAPTERS.map(c => ({ id: c.id, num: c.num, title: c.title, wordCount: c.wordCount })),
};

// The resolver the catalogue normally provides (ARCHITECTURE §4).
// __resolveDelay lets the LRU test hold a refill in flight long enough to
// prove the spacer stays put while its chapter loads.
window.__resolveCalls = [];
window.resolveChapterContent = function (series, chapter) {
  window.__resolveCalls.push(chapter.id);
  const src = CHAPTERS.find(c => c.id === chapter.id) || LRU_CHAPTERS.find(c => c.id === chapter.id);
  if (!src) return Promise.reject(new Error('no such chapter: ' + chapter.id));
  // Async on purpose — the real one goes to IndexedDB or the network.
  return new Promise(res => setTimeout(() => res({
    seriesId: series.id, id: src.id, num: src.num, title: src.title,
    kind: 'text', blocks: src.blocks, wordCount: src.wordCount,
  }), window.__resolveDelay || 10));
};
</script>

<script src="../js/novel-reader.js"></script>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// Test surface driven by Playwright
// ─────────────────────────────────────────────────────────────────────────────
function logLine(s) {
  const l = document.getElementById('log');
  if (l) l.textContent += s + '\n';
}

const T = {
  SERIES, CHAPTERS, LRU_SERIES, LRU_CHAPTERS,

  /** Wipe every trace of a previous run so each test starts cold. */
  async reset() {
    try { localStorage.clear(); } catch (e) {}
    // Store caches both pref bags in memory; clearing localStorage alone
    // leaves the previous test's prefs live. reload() re-reads the (now
    // empty) storage, so prefs really start cold.
    try { Store.prefs.reload(); } catch (e) {}
    if (window.NovelReader.isOpen()) window.NovelReader.close({ navigate: false });
    try { await Store.deleteProgress(SERIES.id); } catch (e) {}
    try { await Store.deleteProgress(LRU_SERIES.id); } catch (e) {}
    window.__resolveCalls.length = 0;
    window.__navigatedAway = 0;
    window.__wentHome = 0;
    window.__pwned = undefined;
    window.__resolveDelay = undefined;
    try { delete window.Thoughts; } catch (e) { window.Thoughts = undefined; }
    this.unstubTuning();
  },

  /** open() with chapter `n` (1-based) and an optional resume record. */
  async open(n, resume) {
    const i = (n || 1) - 1;
    await window.NovelReader.open({
      series: SERIES,
      chapter: SERIES.chapters[i],
      blocks: CHAPTERS[i].blocks,
      resume: resume || null,
    });
    return window.NovelReader.state();
  },

  mode(m) {
    // Drive it through the settings sheet, the way a user would, rather than
    // through a private method — the sheet is part of what is under test.
    const btn = [...document.querySelectorAll('#novel-screen .nv-seg button')]
      .find(b => b.dataset.value === m);
    if (!btn) throw new Error('no mode button for ' + m);
    btn.click();
    return window.NovelReader.state();
  },

  press(key, opts) {
    document.dispatchEvent(new KeyboardEvent('keydown', Object.assign({ key, bubbles: true, cancelable: true }, opts || {})));
    return window.NovelReader.state();
  },

  clickByLabel(label) {
    const b = document.querySelector('#novel-screen [aria-label="' + label + '"]');
    if (!b) throw new Error('no control labelled ' + label);
    b.click();
  },

  /** Text of the block the reader is currently anchored on. */
  anchorText() {
    const s = window.NovelReader.state();
    const sec = document.querySelector('#novel-screen .nv-section[data-chapter-id="' + s.anchor.chapterId + '"]');
    if (!sec) return null;
    const node = sec.querySelector('[data-b="' + s.anchor.blockIdx + '"]');
    return node ? node.textContent.slice(0, 60) : null;
  },

  /** Is the anchored block actually on screen right now? */
  anchorVisible() {
    const s = window.NovelReader.state();
    const sec = document.querySelector('#novel-screen .nv-section[data-chapter-id="' + s.anchor.chapterId + '"]');
    if (!sec) return false;
    const node = sec.querySelector('[data-b="' + s.anchor.blockIdx + '"]');
    if (!node) return false;
    const r = node.getBoundingClientRect();
    if (s.mode === 'paged') {
      const measure = document.querySelector('#novel-screen .nv-measure').getBoundingClientRect();
      // Overlap with the visible column box, with a pixel of slack.
      return r.right > measure.left - 1 && r.left < measure.right + 1;
    }
    return r.bottom > 0 && r.top < window.innerHeight;
  },

  counts() {
    const q = s => document.querySelectorAll('#novel-screen ' + s).length;
    return {
      sections: q('.nv-section'),
      paragraphs: q('.nv-doc p'),
      headings: q('.nv-doc h2') + q('.nv-doc h3'),
      dividers: q('.nv-divider'),
      chnav: q('.nv-chnav'),
      notes: q('.nv-note'),
      figures: q('.nv-figure'),
      lists: q('.nv-doc ul') + q('.nv-doc ol'),
      collapsed: q('.nv-section.nv-collapsed'),
      zones: q('.nv-zone'),
    };
  },

  footer() {
    const f = document.querySelector('#novel-screen .nv-status-line');
    return f ? f.textContent : '';
  },

  visibleText() {
    // Everything actually painted inside the column/scroll box.
    const doc = document.querySelector('#novel-screen .nv-doc');
    return doc ? doc.textContent.length : 0;
  },

  scrollToBottom() {
    const v = document.querySelector('#novel-screen .nv-viewport');
    v.scrollTop = v.scrollHeight;
    return v.scrollTop;
  },

  async progress() { return await Store.getProgress(SERIES.id); },

  // ── state.loaded LRU (PLAN.md §4.1 / §9) ───────────────────────────────────

  /** Fake Platform with only what novel-reader.js reads: tuning(). Installed
      BEFORE open() because the cap is read exactly once per session. */
  stubTuning(maxLoadedChapters) {
    window.Platform = {
      isNative: false,
      tuning: function () {
        return { memoryWindow: 25, cacheWindow: 60, lookBehind: 4, lookAhead: 10,
                 maxLoadedChapters: maxLoadedChapters, chapterCacheMB: 200, pageCacheMB: 400 };
      },
    };
  },
  unstubTuning() { try { delete window.Platform; } catch (e) { window.Platform = undefined; } },

  /** With no Platform at all the cap must be the mid-row default of 10, and
      the state() diagnostics must expose the Map. */
  async testLoadedDiagnostics() {
    const out = { passed: 0, failed: 0, lines: [] };
    const ok = (cond, label, detail) => {
      out[cond ? 'passed' : 'failed']++;
      out.lines.push((cond ? 'PASS  ' : 'FAIL  ') + label + (cond || detail == null ? '' : '  — got: ' + detail));
    };
    await this.reset();
    await this.open(1);
    let s = window.NovelReader.state();
    ok(s.maxLoadedChapters === 10, 'cap defaults to 10 with Platform absent', s.maxLoadedChapters);
    ok(s.loadedCount === 1 || s.loadedCount === 2, 'open() seeds one chapter (± the prefetch)', s.loadedCount);
    ok(Array.isArray(s.loadedIds) && s.loadedIds.indexOf('c-0001') !== -1, 'loadedIds lists the open chapter', JSON.stringify(s.loadedIds));

    // The stub must win over the default on the NEXT open, not retroactively.
    this.stubTuning(6);
    ok(window.NovelReader.state().maxLoadedChapters === 10, 'cap is not re-read mid-session', window.NovelReader.state().maxLoadedChapters);
    window.NovelReader.close({ navigate: false });
    await this.open(1);
    s = window.NovelReader.state();
    ok(s.maxLoadedChapters === 6, 'cap re-read from Platform.tuning() on open()', s.maxLoadedChapters);
    window.NovelReader.close({ navigate: false });
    this.unstubTuning();
    return out;
  },

  /** The full LRU drill: forward scroll caps state.loaded and evicts an
      out-of-window spacer; scrolling back refills it through the resolver with
      the spacer holding its height, and the reader's position does not jump. */
  async testLru() {
    const out = { passed: 0, failed: 0, lines: [] };
    const ok = (cond, label, detail) => {
      out[cond ? 'passed' : 'failed']++;
      out.lines.push((cond ? 'PASS  ' : 'FAIL  ') + label + (cond || detail == null ? '' : '  — got: ' + detail));
    };
    const raf = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    const wait = ms => new Promise(r => setTimeout(r, ms));
    const settle = async () => { await raf(); await wait(70); await raf(); };
    const until = async (fn, ms) => {
      const t0 = Date.now();
      while (Date.now() - t0 < (ms || 4000)) { if (fn()) return true; await settle(); }
      return !!fn();
    };
    const sectionOf = id => document.querySelector('#novel-screen .nv-section[data-chapter-id="' + id + '"]');
    const filled = id => {
      const sec = sectionOf(id);
      return !!(sec && !sec.classList.contains('nv-collapsed') && sec.querySelectorAll('[data-b]').length > 0);
    };
    const anchoredTop = () => {
      const s = window.NovelReader.state();
      const sec = sectionOf(s.anchor.chapterId);
      const node = sec && sec.querySelector('[data-b="' + s.anchor.blockIdx + '"]');
      return node ? node.getBoundingClientRect().top : null;
    };
    const resolveCount = id => window.__resolveCalls.filter(x => x === id).length;

    const CAP = 6;
    await this.reset();
    this.stubTuning(CAP);
    try {
      await window.NovelReader.open({
        series: LRU_SERIES, chapter: LRU_SERIES.chapters[0], blocks: LRU_CHAPTERS[0].blocks, resume: null,
      });
      ok(window.NovelReader.state().maxLoadedChapters === CAP, 'stubbed cap picked up at open()',
         window.NovelReader.state().maxLoadedChapters);
      this.mode('infinite');
      await settle();

      const v = document.querySelector('#novel-screen .nv-viewport');
      let maxSeen = 0, capViolated = null;
      const sample = () => {
        const s = window.NovelReader.state();
        if (s.loadedCount > maxSeen) maxSeen = s.loadedCount;
        if (s.loadedCount > s.maxLoadedChapters && !capViolated) {
          capViolated = s.loadedCount + ' > ' + s.maxLoadedChapters;
        }
      };

      // March forward until the reader stands in chapter 7. Steps are under a
      // viewport so the geometric chapter tracker never skips a section.
      for (let guard = 0; guard < 120 && window.NovelReader.state().chapterIndex < 6; guard++) {
        v.scrollTop = v.scrollTop + Math.max(200, Math.floor(v.clientHeight * 0.8));
        await settle();
        sample();
      }
      const sMid = window.NovelReader.state();
      ok(sMid.chapterIndex >= 6, 'scrolled forward into chapter 7+', 'chapterIndex=' + sMid.chapterIndex);
      ok(!capViolated, 'loaded.size never exceeded maxLoadedChapters going forward', capViolated);
      ok(maxSeen === CAP, 'the session filled the cap exactly (' + CAP + ')', maxSeen);
      ok(sMid.sections.indexOf('l-0001') !== -1, 'chapter 1 section still stacked', sMid.sections.join(','));
      ok(sMid.collapsed.indexOf('l-0001') !== -1, 'chapter 1 is a collapsed spacer', sMid.collapsed.join(','));
      ok(sMid.loadedIds.indexOf('l-0001') === -1, 'chapter 1 evicted from state.loaded', sMid.loadedIds.join(','));

      // March back to chapter 4 and stop: the ±2 window is then [2..6], so
      // evicted chapter 1 is still outside it and still a spacer.
      for (let guard = 0; guard < 120 && window.NovelReader.state().chapterIndex > 3; guard++) {
        v.scrollTop = Math.max(0, v.scrollTop - Math.max(150, Math.floor(v.clientHeight * 0.6)));
        await settle();
        sample();
      }
      await settle();

      // Slow the resolver so the pending refill is observable, then nudge the
      // reader into chapter 3 — that walks the window over evicted chapter 1
      // while everything else stands still.
      window.__resolveDelay = 250;
      const callsBefore = resolveCount('l-0001');
      for (let guard = 0; guard < 40 && window.NovelReader.state().chapterIndex > 2; guard++) {
        v.scrollTop = Math.max(0, v.scrollTop - 140);
        await raf(); await wait(30);
      }
      await raf();
      const sec1 = sectionOf('l-0001');
      const pendingSpacer = !!(sec1 && sec1.classList.contains('nv-collapsed') && sec1.offsetHeight > 60);
      const preTop = anchoredTop();
      const preScroll = v.scrollTop;

      const refilled = await until(() => filled('l-0001'), 5000);
      await settle();
      const postTop = anchoredTop();
      ok(refilled, 'evicted chapter 1 refilled after scrolling back');
      ok(pendingSpacer || refilled, 'spacer held its height while the refill was in flight', pendingSpacer);
      ok(resolveCount('l-0001') > callsBefore, 'refill re-resolved chapter 1 through resolveChapterContent',
         callsBefore + ' -> ' + resolveCount('l-0001'));
      // The reader did not move between the pre-refill and post-refill frames.
      // Tolerance is one line box, not zero: any measure-height change also
      // runs the module's own debounced resize settle, which re-aligns the
      // anchored CHARACTER to the top of the readable band — a deliberate
      // sub-line nudge that happens on every expand, evicted or not. A missed
      // or doubled refill compensation would be off by the spacer's height
      // (thousands of pixels here), which this bound catches loudly.
      const LINE = 19 * 1.65 + 2;   // default font-size × line-height + slack
      ok(preTop != null && postTop != null && Math.abs(postTop - preTop) <= LINE,
         'no position jump across the refill (≤ one line box)',
         preTop + ' -> ' + postTop + ' (scrollTop ' + preScroll + ' -> ' + v.scrollTop + ')');
      sample();
      ok(!capViolated, 'loaded.size never exceeded the cap across the whole drill', capViolated);
    } finally {
      window.__resolveDelay = undefined;
      if (window.NovelReader.isOpen()) window.NovelReader.close({ navigate: false });
      this.unstubTuning();
    }
    return out;
  },

  /** The Capacitor local-file schemes must pass safeImageUrl as EXACT prefixes
      — and lookalike hosts/schemes must keep failing (PLAN.md §6.2). */
  async testImgPinning() {
    const out = { passed: 0, failed: 0, lines: [] };
    const ok = (cond, label, detail) => {
      out[cond ? 'passed' : 'failed']++;
      out.lines.push((cond ? 'PASS  ' : 'FAIL  ') + label + (cond || detail == null ? '' : '  — got: ' + detail));
    };
    await this.reset();
    const blocks = [
      { t: 'p', c: 'Scheme-pinning drill.' },
      { t: 'img', src: 'capacitor://localhost/pages/s1/001.png', alt: 'iOS local page' },
      { t: 'img', src: 'https://localhost/_capacitor_file_/pages/s1/002.png', alt: 'Android local page' },
      { t: 'img', src: 'capacitor://localhost.evil/pages/s1/003.png', alt: 'lookalike host' },
      { t: 'img', src: 'capacitor-evil://localhost/pages/s1/004.png', alt: 'lookalike scheme' },
    ];
    await window.NovelReader.open({ series: SERIES, chapter: SERIES.chapters[0], blocks, resume: null });
    const figs = [...document.querySelectorAll('#novel-screen .nv-figure')];
    const img = i => figs[i] ? figs[i].querySelector('img') : null;
    ok(figs.length === 4, 'every img block yields a figure (index stability)', figs.length);
    ok(!!img(0) && img(0).getAttribute('src') === 'capacitor://localhost/pages/s1/001.png',
       'capacitor://localhost/ prefix passes', img(0) && img(0).getAttribute('src'));
    // The harness proxy shim rewrites http(s) URLs, so assert the prefix.
    ok(!!img(1) && img(1).getAttribute('src').indexOf('https://localhost/_capacitor_file_/') === 0,
       'https://localhost/_capacitor_file_/ prefix passes', img(1) && img(1).getAttribute('src'));
    ok(!img(2) && figs[2] && figs[2].classList.contains('nv-img-failed'),
       'capacitor://localhost.evil host is refused');
    ok(!img(3) && figs[3] && figs[3].classList.contains('nv-img-failed'),
       'capacitor-evil:// scheme is refused');
    window.NovelReader.close({ navigate: false });
    return out;
  },

  // ── Reader-mode presets (PLAN7 §2.6) ───────────────────────────────────────

  /** The chip rail lives in the settings sheet, which is built at ensureDom
      and re-rendered on every sheet open. Toggle the sheet through its real
      button so external pref writes land in the rail. */
  refreshSheet() {
    const btn = document.querySelector('#novel-screen [aria-label="Reading settings"]');
    if (!btn) throw new Error('no settings button');
    if (window.NovelReader.state().sheetOpen) btn.click();   // close…
    btn.click();                                             // …open → re-render
  },

  presetChip(name) {
    return [...document.querySelectorAll('#novel-screen .nv-presets .nv-preset-chip')]
      .find(b => b.textContent === name) || null;
  },

  /** Apply-batch: every bundled key lands in ONE relayout, the anchor holds,
      and the writes are per-series (the storeSet path). */
  async testPresets() {
    const out = { passed: 0, failed: 0, lines: [] };
    const ok = (cond, label, detail) => {
      out[cond ? 'passed' : 'failed']++;
      out.lines.push((cond ? 'PASS  ' : 'FAIL  ') + label + (cond || detail == null ? '' : '  — got: ' + detail));
    };
    await this.reset();
    await this.open(1);

    const names = ['Classic paperback', 'Night scroll', 'Dyslexia-friendly', 'Dense terminal', 'Large print'];
    ok(names.every(n => !!this.presetChip(n)), 'all five built-in chips render',
       [...document.querySelectorAll('#novel-screen .nv-preset-chip')].map(b => b.textContent).join('|'));

    // Move a few pages in so the anchor is meaningfully non-zero.
    this.press('ArrowRight'); this.press('ArrowRight'); this.press('ArrowRight');
    let s0 = window.NovelReader.state();
    const anchorBefore = s0.anchor;
    ok(anchorBefore.blockIdx > 0, 'anchor moved off block 0 before applying', anchorBefore.blockIdx);

    // Large print: paged → paged (no mode change) — exactly one layout pass.
    const l1 = s0.layoutCount;
    this.presetChip('Large print').click();
    let s = window.NovelReader.state();
    ok(s.layoutCount - l1 === 1, 'same-mode preset costs exactly one relayout', s.layoutCount - l1);
    const p = s.prefs;
    ok(s.mode === 'paged' && p.fontFamily === 'atkinson' && p.fontSize === 26 && p.lineHeight === 1.8
       && p.width === 'normal' && p.align === 'left' && p.paraSpacing === 'normal' && p.indent === false
       && p.letterSpacing === 0.02 && p.wordSpacing === 0.08 && p.theme === 'light',
       'Large print applied every bundled key', JSON.stringify(p));
    ok(s.anchor.chapterId === anchorBefore.chapterId && s.anchor.blockIdx === anchorBefore.blockIdx
       && s.anchor.charInBlock === anchorBefore.charInBlock,
       'anchor kept across the batch', JSON.stringify(s.anchor));
    ok(this.anchorVisible(), 'anchored block still on screen');
    ok(p.customBg === '#f4ecd8' && p.customFg === '#43341f',
       'custom colours untouched by a built-in', p.customBg + '/' + p.customFg);

    // Night scroll: paged → infinite (mode change) — still one layout pass.
    const l2 = s.layoutCount;
    this.presetChip('Night scroll').click();
    s = window.NovelReader.state();
    ok(s.mode === 'infinite' && s.prefs.theme === 'black' && s.prefs.fontFamily === 'sans'
       && s.prefs.fontSize === 18 && s.prefs.width === 'narrow',
       'Night scroll applied, including the mode', s.mode + '/' + s.prefs.theme);
    ok(s.layoutCount - l2 === 1, 'mode-changing preset still costs exactly one relayout', s.layoutCount - l2);
    ok(s.anchor.chapterId === anchorBefore.chapterId && s.anchor.blockIdx === anchorBefore.blockIdx,
       'anchor survives the mode rebuild', JSON.stringify(s.anchor));

    // Persistence: per-series (storeSet), never global.
    ok(Store.prefs.getFor(SERIES.id, 'novel.fontSize', null) === 18,
       'preset wrote per-series prefs', Store.prefs.getFor(SERIES.id, 'novel.fontSize', null));
    ok(Store.prefs.get('novel.fontSize', 'unset') === 'unset',
       'global prefs untouched', Store.prefs.get('novel.fontSize', 'unset'));

    // A toast names the preset.
    const toastEl = document.querySelector('#novel-screen .nv-toast');
    ok(!!toastEl && !toastEl.hidden && toastEl.textContent.indexOf('Night scroll') !== -1,
       'toast names the applied preset', toastEl && toastEl.textContent);

    // No "active preset" state is stored anywhere.
    ok(Store.prefs.get('novel.presets', null) === null, 'applying stores no active-preset state');

    window.NovelReader.close({ navigate: false });
    return out;
  },

  /** Save-current round-trips through novel.presets; corrupt entries drop
      silently on read; values re-validate at apply time; cap 6 refuses;
      delete works and Undo restores. */
  async testPresetSaveLoad() {
    const out = { passed: 0, failed: 0, lines: [] };
    const ok = (cond, label, detail) => {
      out[cond ? 'passed' : 'failed']++;
      out.lines.push((cond ? 'PASS  ' : 'FAIL  ') + label + (cond || detail == null ? '' : '  — got: ' + detail));
    };
    await this.reset();
    await this.open(1);
    const strip = () => document.querySelector('#novel-screen .nv-presets');
    const form  = () => document.querySelector('#novel-screen .nv-preset-form');
    const saveChip = () => [...strip().querySelectorAll('button')].find(b => b.textContent === '+ Save current');
    const customItems = () => [...strip().querySelectorAll('.nv-preset-item')].filter(i => i.querySelector('.nv-preset-del'));

    ok(!!saveChip(), 'trailing "+ Save current" chip renders');
    ok(customItems().length === 0, 'no custom chips on a cold profile');

    // Distinctive snapshot: bump the size twice (19 → 21).
    this.press('+'); this.press('+');
    saveChip().click();
    ok(form() && !form().hidden && strip().hidden, 'mini-form swaps in for the rail');
    const input = form().querySelector('input');
    ok(input && input.value === 'My preset 1', 'name prefilled "My preset N"', input && input.value);
    input.value = 'Evening train';
    [...form().querySelectorAll('button')].find(b => b.textContent === 'Save').click();
    ok(form().hidden && !strip().hidden, 'form swaps back out after saving');

    const stored = Store.prefs.get('novel.presets', null);
    ok(Array.isArray(stored) && stored.length === 1 && stored[0].name === 'Evening train',
       'saved into novel.presets', JSON.stringify(stored));
    ok(stored[0].prefs.fontSize === 21 && stored[0].prefs.mode === 'paged'
       && stored[0].prefs.fontFamily === 'serif' && stored[0].prefs.customBg === undefined,
       'snapshot is the current effective prefs (no custom colours outside the custom theme)',
       JSON.stringify(stored[0].prefs));

    const item = customItems()[0];
    ok(!!item && item.querySelector('.nv-preset-chip').textContent === 'Evening train'
       && !!item.querySelector('.nv-preset-del'),
       'custom chip renders after built-ins with a delete affordance');

    // Drift, then load the saved preset back — the round trip.
    this.press('-'); this.press('-'); this.press('-');
    ok(window.NovelReader.state().prefs.fontSize === 18, 'drifted away from the snapshot',
       window.NovelReader.state().prefs.fontSize);
    item.querySelector('.nv-preset-chip').click();
    ok(window.NovelReader.state().prefs.fontSize === 21, 'saved preset round-trips through the pref',
       window.NovelReader.state().prefs.fontSize);

    // Corrupt entries are dropped silently on read.
    Store.prefs.set('novel.presets', [
      { name: 'Sane', prefs: { fontSize: 22 } },
      { bogus: 1 }, 'nope', 42, null,
      { name: '', prefs: {} },
      { name: 'NoPrefs' },
      { name: 'BadPrefs', prefs: 7 },
      { name: ['arr'], prefs: {} },
    ]);
    this.refreshSheet();
    ok(customItems().length === 1
       && customItems()[0].querySelector('.nv-preset-chip').textContent === 'Sane',
       'hand-corrupted entries dropped silently on read', customItems().length);

    // Values re-validate through the readPrefs rules at apply time.
    Store.prefs.set('novel.presets', [{ name: 'Partial', prefs: { fontSize: 900, width: 'bogus', theme: 'sepia' } }]);
    this.refreshSheet();
    const widthBefore = window.NovelReader.state().prefs.width;
    const lBefore = window.NovelReader.state().layoutCount;
    this.presetChip('Partial').click();
    const sP = window.NovelReader.state();
    ok(sP.prefs.fontSize === 32, 'out-of-range number clamps exactly like readPrefs', sP.prefs.fontSize);
    ok(sP.prefs.width === widthBefore, 'invalid enum value leaves that knob unchanged', sP.prefs.width);
    ok(sP.prefs.theme === 'sepia', 'valid keys in the same preset still apply', sP.prefs.theme);
    ok(sP.layoutCount - lBefore === 1, 'partial preset is still one relayout', sP.layoutCount - lBefore);

    // Cap 6: the 7th save refuses with a toast; nothing is evicted.
    const six = []; for (let i = 0; i < 6; i++) six.push({ name: 'P' + i, prefs: { fontSize: 20 } });
    Store.prefs.set('novel.presets', six);
    this.refreshSheet();
    saveChip().click();
    ok(form().hidden, 'save refused at the cap — the form never opens');
    const toastEl = document.querySelector('#novel-screen .nv-toast');
    ok(!toastEl.hidden && /full/i.test(toastEl.textContent), 'cap toast shown', toastEl.textContent);
    ok(Store.prefs.get('novel.presets', []).length === 6, 'nothing evicted at the cap');

    // Delete is immediate (no confirm) with a single-level Undo.
    customItems()[2].querySelector('.nv-preset-del').click();
    ok(Store.prefs.get('novel.presets', []).length === 5, 'delete removes immediately');
    const undoBtn = toastEl.querySelector('button');
    ok(!!undoBtn && undoBtn.textContent === 'Undo' && !toastEl.hidden, 'undo toast offered');
    undoBtn.click();
    const after = Store.prefs.get('novel.presets', []);
    ok(after.length === 6 && after[2].name === 'P2', 'Undo restores the preset at its index',
       JSON.stringify(after.map(x => x.name)));

    window.NovelReader.close({ navigate: false });
    return out;
  },

  /** Preset names are third-party strings: a hostile name must render as
      literal text, clamped to 40 chars, creating no nodes and running nothing. */
  async testPresetNameXss() {
    const out = { passed: 0, failed: 0, lines: [] };
    const ok = (cond, label, detail) => {
      out[cond ? 'passed' : 'failed']++;
      out.lines.push((cond ? 'PASS  ' : 'FAIL  ') + label + (cond || detail == null ? '' : '  — got: ' + detail));
    };
    await this.reset();
    await this.open(1);
    const HOSTILE = '<img src=x onerror="window.__pwned=1"><script>window.__pwned=1<\/script>';
    Store.prefs.set('novel.presets', [{ name: HOSTILE, prefs: { fontSize: 20 } }]);
    this.refreshSheet();
    const strip = document.querySelector('#novel-screen .nv-presets');
    const chip = [...strip.querySelectorAll('.nv-preset-chip')].find(b => b.textContent.indexOf('<img') === 0);
    ok(!!chip, 'hostile name still renders as a chip');
    ok(chip && chip.textContent === HOSTILE.slice(0, 40), 'name is literal text, clamped to 40',
       chip && chip.textContent);
    ok(strip.querySelectorAll('img, script').length === 0, 'no elements created from the name');
    // Applying it routes the name through the toast — also textContent-only.
    chip.click();
    const toastEl = document.querySelector('#novel-screen .nv-toast');
    ok(toastEl.querySelectorAll('img, script').length === 0, 'toast renders the name inert');
    // And through the save form.
    this.refreshSheet();
    const saveChip = [...strip.querySelectorAll('button')].find(b => b.textContent === '+ Save current');
    saveChip.click();
    const form = document.querySelector('#novel-screen .nv-preset-form');
    form.querySelector('input').value = HOSTILE;
    [...form.querySelectorAll('button')].find(b => b.textContent === 'Save').click();
    const stored = Store.prefs.get('novel.presets', []);
    ok(stored.length === 2 && stored[1].name === HOSTILE.slice(0, 40), 'saved name clamped to 40',
       JSON.stringify(stored[1] && stored[1].name));
    ok(document.querySelectorAll('#novel-screen .nv-presets img, #novel-screen .nv-presets script').length === 0,
       'saved hostile chip is inert');
    ok(!window.__pwned, 'no script executed');
    window.NovelReader.close({ navigate: false });
    return out;
  },

  // ── "Depart your thoughts" CTAs (PLAN7 §2.7, novel-reader half) ───────────

  async testThoughtsCta() {
    const out = { passed: 0, failed: 0, lines: [] };
    const ok = (cond, label, detail) => {
      out[cond ? 'passed' : 'failed']++;
      out.lines.push((cond ? 'PASS  ' : 'FAIL  ') + label + (cond || detail == null ? '' : '  — got: ' + detail));
    };
    await this.reset();
    window.__thoughtCalls = [];
    window.Thoughts = {
      open: function (p) { window.__thoughtCalls.push(p); },
      openScreen: function () {}, close: function () {},
    };
    const q = sel => document.querySelectorAll('#novel-screen ' + sel);

    // Last chapter, chapter mode → the book CTA sits right after .nv-end.
    await this.open(6);
    this.mode('chapter');
    ok(q('.nv-end').length === 1, 'end marker renders on the last chapter');
    let cta = document.querySelector('#novel-screen .nv-thoughts-cta');
    ok(!!cta && cta.textContent === 'Depart your thoughts', 'book CTA renders');
    ok(!!cta && !!cta.previousElementSibling && cta.previousElementSibling.classList.contains('nv-end'),
       'CTA sits immediately after the end marker');
    ok(!!cta && !cta.hasAttribute('data-b'), 'CTA carries no block index (outside blockEls)');
    const sec = document.querySelector('#novel-screen .nv-section');
    ok(sec.querySelectorAll('[data-b]').length === CHAPTERS[5].blocks.length,
       'block indices undisturbed by the CTA', sec.querySelectorAll('[data-b]').length);
    cta.click();
    ok(window.__thoughtCalls.length === 1, 'CTA calls Thoughts.open exactly once');
    const call = window.__thoughtCalls[0];
    ok(!!call && call.kind === 'book' && call.seriesId === SERIES.id
       && call.seriesTitle === SERIES.title && call.chapterId === null && call.chapterTitle === null,
       'book-level payload (chapter fields null)', JSON.stringify(call));

    // Infinite mode: the CTA follows .nv-end there too.
    this.mode('infinite');
    await new Promise(r => setTimeout(r, 100));
    cta = document.querySelector('#novel-screen .nv-thoughts-cta');
    ok(!!cta && !!cta.previousElementSibling && cta.previousElementSibling.classList.contains('nv-end'),
       'infinite mode carries the CTA after the end marker');

    // Chapter cadence is off by default…
    await this.open(1);
    this.mode('chapter');
    ok(q('.nv-thoughts-cta').length === 0, 'no chapter CTA while thoughts.chapterPrompt is off');
    // …and opt-in via the pref.
    Store.prefs.set('thoughts.chapterPrompt', true);
    await this.open(1);
    const sm = document.querySelector('#novel-screen .nv-thoughts-cta');
    ok(!!sm && sm.classList.contains('nv-thoughts-cta-sm'), 'smaller text-button variant when toggled on');
    ok(!!sm && !!sm.previousElementSibling && sm.previousElementSibling.classList.contains('nv-chnav'),
       'chapter CTA follows the bottom chapter nav');
    sm.click();
    const c2 = window.__thoughtCalls[window.__thoughtCalls.length - 1];
    ok(!!c2 && c2.kind === 'chapter' && c2.chapterId === 'c-0001'
       && c2.chapterTitle === 'The Ledger of Small Debts',
       'chapter payload carries chapter context', JSON.stringify(c2));

    // Module absent → nothing renders, no errors (§0.5).
    delete window.Thoughts;
    await this.open(6);
    ok(q('.nv-thoughts-cta').length === 0, 'no CTA with window.Thoughts absent');
    ok(q('.nv-end').length === 1, 'end marker unaffected by the missing module');

    Store.prefs.set('thoughts.chapterPrompt', false);
    window.NovelReader.close({ navigate: false });
    return out;
  },

  // ── Home header button (PLAN7 §2.11-C) ────────────────────────────────────

  async testHomeButton() {
    const out = { passed: 0, failed: 0, lines: [] };
    const ok = (cond, label, detail) => {
      out[cond ? 'passed' : 'failed']++;
      out.lines.push((cond ? 'PASS  ' : 'FAIL  ') + label + (cond || detail == null ? '' : '  — got: ' + detail));
    };
    await this.reset();
    await this.open(1);
    const home = document.querySelector('#novel-screen .nv-header [aria-label="Home"]');
    ok(!!home, 'home button renders in the header');
    ok(!!home && home.classList.contains('nv-btn') && home.classList.contains('nv-home'),
       'home button carries the .nv-btn chrome + the 44px pad class');
    ok(!!home && !!home.querySelector('svg path'), 'diamond glyph present');
    const back = document.querySelector('#novel-screen .nv-header [aria-label="Close reader"]');
    ok(!!back && back.nextElementSibling === home, 'home sits directly after the back chevron');

    // Move somewhere non-trivial so the flush has something to say.
    this.press('ArrowRight'); this.press('ArrowRight');
    home.click();
    ok(window.NovelReader.isOpen() === false, 'reader fully closed (api.isOpen() false)');
    ok(window.__wentHome === 1, 'Catalogue.goHome called exactly once', window.__wentHome);
    ok(window.__navigatedAway === 0, 'goBack NOT used for the home exit', window.__navigatedAway);
    await new Promise(r => setTimeout(r, 80));
    const p = await Store.getProgress(SERIES.id);
    ok(!!p && p.chapterId === 'c-0001' && p.pct > 0, 'progress flushed before leaving',
       p && (p.chapterId + '@' + p.pct));
    return out;
  },

  /** Log a testLru()/testLoadedDiagnostics() result for a human at the page. */
  report(r) {
    r.lines.forEach(logLine);
    logLine('-- ' + r.passed + ' passed, ' + r.failed + ' failed');
    return r;
  },

  dump() { logLine(JSON.stringify(window.NovelReader.state(), null, 1)); },

  hideHarness() {
    document.getElementById('harness').classList.add('off');
    document.getElementById('log').classList.add('off');
  },
};
window.T = T;
</script>
