<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Settings focus-sheet test harness</title>
  <link rel="stylesheet" href="../css/settings.css">
  <style>
    body { margin: 0; padding: 12px; background: #0a0a0a; color: #f0f0f0;
           font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; }
    #log { margin-top: 12px; white-space: pre-wrap; }
    .pass { color: #34d399; }
    .fail { color: #f0616d; }
  </style>
  <script>
    // The sheet offers itself only while app.focus has never been chosen, and
    // the pref lives in localStorage — so the slate has to be clean before
    // settings.js parses, not after.
    try { localStorage.clear(); } catch (e) {}
  </script>
</head>
<body>
  <div id="log"></div>
  <div id="summary"></div>

  <!-- The real dependency chain, in index.html's order, minus js/identity.js. -->
  <script src="../js/config.js"></script>
  <script src="../js/platform.js"></script>
  <script src="../js/store.js"></script>
  <script>
    // Stand-ins for the two modules the Prepared audio row reads. index.html
    // loads novel-voice.js and catalogue.js around settings.js; here they are
    // just the surface that row uses.
    window.__prepared = [
      { book: 'user:a', title: '', chapters: 12, bytes: 260e6, seconds: 40000 },
      { book: 'user:gone', title: 'An Old Book', chapters: 3, bytes: 50e6, seconds: 9000 },
    ];
    window.__removed = [];
    window.NovelVoice = { preparedLibrary: {
      list: () => Promise.resolve(window.__prepared.slice()),
      remove: id => { window.__removed.push(id); window.__prepared = window.__prepared.filter(b => b.book !== id); return Promise.resolve(); },
    } };
    window.Catalogue = { getSeries: id => id === 'user:a' ? { id, title: 'The Quiet Ledger', chapters: new Array(12) } : null };
  </script>
  <script src="../js/settings.js"></script>
  <script>
    'use strict';
    const results = { passed: 0, failed: 0, lines: [] };
    window.__results = results;

    function report(ok, label, detail) {
      const row = document.createElement('div');
      row.className = ok ? 'pass' : 'fail';
      row.textContent = (ok ? 'PASS  ' : 'FAIL  ') + label + (ok || !detail ? '' : '  ' + detail);
      document.getElementById('log').appendChild(row);
      results[ok ? 'passed' : 'failed']++;
      results.lines.push(row.textContent);
    }
    function assert(value, label, detail) { report(!!value, label, detail); }
    function assertEq(actual, expected, label) {
      report(Object.is(actual, expected), label, 'got ' + JSON.stringify(actual) + ', wanted ' + JSON.stringify(expected));
    }

    window.__done = (async function () {
      assertEq(typeof window.Identity, 'undefined', 'no identity module is loaded');
      assert(window.AppSettings && window.AppSettings.maybeOfferFocus, 'settings registered its public API');
      assertEq(Store.prefs.get('app.focus', null), null, 'app.focus starts unchosen');

      // The real entry point the catalogue calls after its first home render.
      AppSettings.maybeOfferFocus();

      const sheet = document.querySelector('.set-focus-sheet');
      assert(sheet, 'the focus sheet is in the DOM');
      assertEq(sheet.hidden, false, 'the sheet is shown');
      assertEq(sheet.getAttribute('aria-modal'), 'true', 'the sheet is a modal dialog');

      // The library card: a heading, a card, one paragraph, no decision.
      const block = sheet.querySelector('.set-account-block');
      assert(block, 'the library card block renders unconditionally');
      assertEq(block.querySelector('.set-theme-label').textContent, 'And your library?',
        'the block keeps its heading');
      const card = block.querySelector('.set-account-card');
      assert(card, 'the card itself renders');
      const copy = card.querySelector('.set-account-copy');
      assert(copy && /lives on this device/.test(copy.textContent),
        'the copy is the local-only one', copy && copy.textContent);
      assert(copy && /nothing leaves/.test(copy.textContent),
        'the copy still promises nothing leaves');

      // No account promised that does not exist.
      assertEq(block.querySelector('.set-account-btn'), null, 'no sign-in button class survives');
      assertEq(block.querySelectorAll('button').length, 0, 'the block renders no control at all');
      assert(!/[Ss]ign in/.test(block.textContent), 'the block never says "Sign in"', block.textContent);

      // Position: the card sits after the theme block, last of the three
      // onboarding answers and before the tour button.
      const blocks = Array.from(sheet.querySelector('.set-sheet-body').children);
      assert(blocks.indexOf(block) > blocks.findIndex(n => n.classList.contains('set-theme-block')),
        'the card still follows the theme question');

      // Dismissal still settles the pref, which is what stops the re-prompt.
      sheet.querySelector('.set-card-comics').click();
      assertEq(Store.prefs.get('app.focus', null), 'comics', 'choosing a focus persists it');
      assertEq(sheet.hidden, true, 'choosing a focus closes the sheet');

      AppSettings.maybeOfferFocus();
      assertEq(sheet.hidden, true, 'the sheet never offers itself twice');

      // Prepared audio: every book with stored narration, its size, Delete.
      AppSettings.openScreen();
      const until = async (fn) => { for (let i = 0; i < 100 && !fn(); i++) await new Promise(r => setTimeout(r, 10)); return fn(); };
      await until(() => document.querySelectorAll('.set-prep-row').length === 2);
      const rows = Array.from(document.querySelectorAll('.set-prep-row'));
      assertEq(rows.length, 2, 'one row per book with stored audio');
      assert(/The Quiet Ledger/.test(rows[0].textContent) && /260 MB/.test(rows[0].textContent) && /ready to listen/.test(rows[0].textContent),
        'the library title, size and status come through', rows[0].textContent);
      assert(/An Old Book/.test(rows[1].textContent) && /no longer in your library/.test(rows[1].textContent),
        'audio left by a removed book is listed and says so', rows[1].textContent);
      const note = document.querySelector('.set-prep-list + .set-note');
      assert(note && /Total 310 MB/.test(note.textContent), 'the total is shown', note && note.textContent);

      let asked = 0;
      window.confirm = () => { asked++; return false; };
      rows[1].querySelector('.set-prep-delete').click();
      await new Promise(r => setTimeout(r, 30));
      assertEq(window.__removed.length, 0, 'Cancel deletes nothing');
      window.confirm = () => { asked++; return true; };
      rows[1].querySelector('.set-prep-delete').click();
      await until(() => document.querySelectorAll('.set-prep-row').length === 1);
      assertEq(asked, 2, 'Delete asks first, every time');
      assertEq(window.__removed.join(), 'user:gone', 'Delete removes that book only');
      assertEq(document.querySelectorAll('.set-prep-row').length, 1, 'the list re-renders without it');

      const summary = document.getElementById('summary');
      summary.textContent = results.failed === 0
        ? 'ALL GREEN — ' + results.passed + ' assertions'
        : results.failed + ' FAILED / ' + results.passed + ' passed';
      summary.className = results.failed === 0 ? 'pass' : 'fail';
      document.title = (results.failed === 0 ? 'PASS' : 'FAIL') + ' — Settings focus-sheet test harness';
      return results;
    })();
  </script>
</body>
</html>
