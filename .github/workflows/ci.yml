name: CI

# The repository had no pull-request CI at all, which is how two shipped CSS
# fixes reached main without the service worker's CACHE_NAME being bumped — the
# code was right, the diff reviewed fine, and no reader ever saw either change.
# This runs the checks that would have caught it.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # check-sw-cache diffs against the base branch, so it needs history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No install step: both suites are node:test with zero runtime deps, and
      # the scraper's cheerio/axios are only needed for a real scrape.
      - name: Worker tests
        working-directory: worker
        run: npm test

      - name: Scraper tests
        working-directory: scraper
        run: npm test

      - name: Catalogue contract (ARCHITECTURE.md §1 and §8)
        working-directory: scraper
        run: node src/validate.js && node src/check-welcome.js

      - name: Service worker cache bumped for shell changes
        run: |
          BASE="${{ github.event.pull_request.base.ref || 'main' }}"
          git fetch --no-tags --depth=1 origin "$BASE" || true
          node scripts/check-sw-cache.mjs "origin/$BASE"
