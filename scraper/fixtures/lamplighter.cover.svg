      <stop offset="0%" stop-color="#12182a"/>
      <stop offset="55%" stop-color="#1d2540"/>
      <stop offset="100%" stop-color="#2b2033"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd487" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#ffb347" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffb347" stop-opacity="0"/>
