<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450" role="img" aria-label="The Ninth Bell of the Meridian Gull">
  <defs>
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2036"/>
      <stop offset="48%" stop-color="#2a4a68"/>
      <stop offset="100%" stop-color="#7d94a6"/>
    </linearGradient>
    <radialGradient id="ring" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9b8" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#ffd27a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="450" fill="url(#dawn)"/>

  <!-- cloudsea -->
  <path d="M0 330 q30 -18 60 -4 q28 13 56 -2 q30 -16 58 0 q28 14 56 -3 q20 -12 70 2 V450 H0 Z" fill="#c9d6de" opacity="0.55"/>
  <path d="M0 362 q40 -16 74 -2 q34 14 68 -3 q36 -18 78 1 q26 12 80 -2 V450 H0 Z" fill="#e4ecf1" opacity="0.6"/>

  <!-- the ring-ship, seen from below and astern -->
  <g fill="#0c1a2b">
    <path d="M60 214 q90 -34 180 0 q-16 26 -90 30 q-74 -4 -90 -30 Z"/>
    <rect x="138" y="176" width="24" height="40" rx="6"/>
  </g>
  <g stroke="#0c1a2b" stroke-width="3" stroke-linecap="round">
    <path d="M86 218 V246"/><path d="M114 222 V252"/><path d="M150 224 V256"/>
    <path d="M186 222 V252"/><path d="M214 218 V246"/>
  </g>

  <!-- the ninth bell, ringing -->
  <circle cx="150" cy="268" r="62" fill="url(#ring)"/>
  <g fill="#f0d9a6" stroke="#0c1a2b" stroke-width="3">
    <path d="M136 244 h28 v6 q14 12 14 30 h-56 q0 -18 14 -30 Z"/>
    <rect x="120" y="280" width="60" height="7" rx="3"/>
  </g>
  <circle cx="150" cy="292" r="4" fill="#0c1a2b"/>

  <!-- sound, going down -->
  <g fill="none" stroke="#ffe9b8" stroke-width="2" stroke-linecap="round" opacity="0.75">
    <path d="M116 306 q34 22 68 0"/>
    <path d="M104 322 q46 30 92 0"/>
    <path d="M92 340 q58 38 116 0"/>
  </g>

  <g fill="#f4efe3" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="150" y="404" font-size="21">The Ninth Bell</text>
    <text x="150" y="428" font-size="16">of the Meridian Gull</text>
  </g>
  <text x="150" y="46" fill="#9db6cc" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="3" text-anchor="middle">SAMPLE SERIES</text>
</svg>
