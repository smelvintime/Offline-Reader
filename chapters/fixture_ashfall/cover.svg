<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450" role="img" aria-label="Ashfall Courier">
  <defs>
    <linearGradient id="ashsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a322c"/>
      <stop offset="52%" stop-color="#6d6259"/>
      <stop offset="100%" stop-color="#b3a89b"/>
    </linearGradient>
    <radialGradient id="vent" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8622a" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#e8622a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="450" fill="url(#ashsky)"/>

  <!-- the Stack -->
  <circle cx="196" cy="150" r="72" fill="url(#vent)"/>
  <path d="M108 232 L176 92 L216 92 L284 232 Z" fill="#2e2723"/>
  <path d="M176 92 q20 -22 40 0" fill="none" stroke="#e8622a" stroke-width="5" stroke-linecap="round"/>

  <!-- rooftops -->
  <path d="M0 262 L34 240 L34 262 L72 236 L72 262 L112 244 L112 262 L152 232 L152 262 L196 250 L196 262 L240 238 L240 262 L300 248 V450 H0 Z" fill="#241f1c"/>

  <!-- the courier, running the ridge -->
  <g stroke="#efe7dc" stroke-width="5" stroke-linecap="round" fill="none" transform="translate(96 300) scale(1.25)">
    <circle cx="0" cy="-8" r="11" fill="#efe7dc"/>
    <path d="M0 3 L0 48"/>
    <path d="M0 16 L-22 34 M0 16 L20 6"/>
    <path d="M0 46 L-16 84 M0 46 L18 78 L26 86"/>
  </g>
  <g transform="translate(96 300) scale(1.25)">
    <path d="M-8 -2 q-26 6 -44 -6 q22 22 44 14 Z" fill="#e8622a"/>
    <rect x="4" y="20" width="20" height="16" rx="3" fill="#efe7dc"/>
  </g>
  <path d="M40 410 H262" stroke="#efe7dc" stroke-width="4"/>

  <!-- falling ash -->
  <g fill="#d8cec2" opacity="0.5">
    <circle cx="34" cy="70" r="2.4"/><circle cx="88" cy="126" r="1.8"/><circle cx="52" cy="182" r="2.6"/>
    <circle cx="132" cy="64" r="2"/><circle cx="264" cy="106" r="2.4"/><circle cx="222" cy="188" r="1.6"/>
    <circle cx="18" cy="248" r="2.2"/><circle cx="278" cy="288" r="2"/><circle cx="150" cy="196" r="1.7"/>
    <circle cx="240" cy="330" r="2.5"/><circle cx="66" cy="336" r="1.9"/><circle cx="188" cy="146" r="2.1"/>
  </g>

  <g fill="#f3ece2" font-family="Verdana, Geneva, sans-serif" text-anchor="middle">
    <text x="150" y="416" font-size="24" font-weight="bold" letter-spacing="1">ASHFALL</text>
    <text x="150" y="438" font-size="15" letter-spacing="6">COURIER</text>
  </g>
  <text x="150" y="42" fill="#cfc2b2" font-family="Verdana, Geneva, sans-serif" font-size="10" letter-spacing="4" text-anchor="middle">SAMPLE SERIES</text>
</svg>
