name: Build catalogue

# Rebuilds catalog.json (schema v2) and chapters/**/*.json from the sources
# listed in scraper/series.json, then commits whatever changed.
#
# A single dead source does NOT fail this workflow: the scraper isolates every
# entry, and any series it cannot refetch is carried over from the committed
# catalog.json. The job only fails if the generated output does not satisfy
# docs/ARCHITECTURE.md §1, or if the catalogue would end up completely empty.

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:
    inputs:
      only:
        description: 'Rebuild only these sources (comma separated, e.g. "gutenberg")'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-catalogue
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scraper/package.json

      - name: Install dependencies
        working-directory: scraper
        run: npm install

      # The previous catalog.json is already on disk from the checkout — the
      # scraper reads it so a failing source keeps its existing entry.
      - name: Build catalogue
        working-directory: scraper
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then
            node src/index.js --only='${{ github.event.inputs.only }}'
          else
            node src/index.js
          fi

      - name: Validate output against ARCHITECTURE.md §1
        working-directory: scraper
        run: npm run validate

      - name: Commit catalog.json and chapters/
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A catalog.json chapters
          if git diff --cached --quiet; then
            echo "No catalogue changes."
            exit 0
          fi
          git commit -m "chore: rebuild catalogue [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push

      - name: Summary
        if: always()
        run: |
          {
            echo "### Catalogue"
            if [ -f catalog.json ]; then
              node -e '
                const c = JSON.parse(require("fs").readFileSync("catalog.json","utf8"));
                console.log("| series | type | source | chapters |");
                console.log("| --- | --- | --- | ---: |");
                for (const s of c.series) console.log(`| ${s.title} | ${s.type} | ${s.source} | ${s.chapters.length} |`);
                console.log("");
                console.log(`Generated ${c.generatedAt} — ${c.series.length} series.`);
              '
            else
              echo "No catalog.json was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
