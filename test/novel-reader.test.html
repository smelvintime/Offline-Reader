<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>NovelReader — test harness</title>

  <!-- Production load order: the app's base skin first, then the reader skin.
       novel.css is scoped under #novel-screen and must survive both. -->
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../css/novel.css">
  <style>
    /* The harness' own chrome. Deliberately outside #novel-screen. */
    #harness {
      position: fixed; z-index: 9000; top: 0; left: 0; right: 0;
      display: flex; flex-wrap: wrap; gap: 4px; padding: 4px;
      background: #111; border-bottom: 1px solid #333;
      font: 12px/1 ui-monospace, Menlo, Consolas, monospace;
    }
    #harness.off { display: none; }
    #harness button { padding: 4px 8px; background: #222; color: #eee; border: 1px solid #444; border-radius: 4px; cursor: pointer; }
    #log { position: fixed; z-index: 9000; bottom: 0; left: 0; right: 0; max-height: 30vh; overflow: auto;
           background: #000c; color: #9f9; font: 11px/1.4 ui-monospace, monospace; padding: 4px; white-space: pre-wrap; }
    #log.off { display: none; }
  </style>
</head>
<body>

<div id="harness">
  <button onclick="T.open()">open</button>
  <button onclick="T.mode('paged')">paged</button>
  <button onclick="T.mode('chapter')">chapter</button>
  <button onclick="T.mode('infinite')">infinite</button>
  <button onclick="T.dump()">state</button>
</div>
<div id="log"></div>

<!-- Real persistence layer — progress assertions go through the real IndexedDB. -->
<script src="../js/config.js"></script>
<script src="../js/store.js"></script>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// Shims for the two globals novel-reader.js expects from reader.js. The real
// reader.js is not loadable here: it reaches for a dozen elements in index.html
// at parse time. These are behaviourally identical for our purposes.
// ─────────────────────────────────────────────────────────────────────────────
const screens = new Set();
window.registerScreen = function (el) { if (el) screens.add(el); return el; };
window.showScreen = function (id) {
  screens.forEach(s => { if (s) s.style.display = 'none'; });
  const t = document.getElementById(id);
  if (t) { screens.add(t); t.style.display = 'block'; document.body.dataset.screen = id; }
};
// Record every URL that goes through the gateway helper, so the test can prove
// image blocks are proxied rather than hot-linked.
window.__proxied = [];
window.proxyImageUrl = function (u) {
  window.__proxied.push(u);
  if (/^(data:|blob:)/i.test(u) || !/^https?:/i.test(u)) return u;
  return u + (u.indexOf('?') === -1 ? '?' : '&') + 'via=proxy';
};

// Catalogue is absent; close() falls back to showScreen('home-screen') which is
// a no-op here. Record the call so the test can assert teardown happened.
window.__navigatedAway = 0;
window.Catalogue = { goBack: function () { window.__navigatedAway++; } };

// ─────────────────────────────────────────────────────────────────────────────
// Fixture — 6 chapters × ~40 blocks of deterministic prose.
//
// Deterministic so a failing assertion is reproducible: a seeded LCG picks the
// sentence shapes, not Math.random.
// ─────────────────────────────────────────────────────────────────────────────
function lcg(seed) { let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }

const WORDS = ('the lantern guttered against a wind that carried salt and iron across the terrace ' +
  'she counted her breaths the way her teacher had taught her slowly and without hope ' +
  'somewhere below the city kept its own accounts in coin and rumour and the occasional quiet knife ' +
  'nothing in the ledger explained why the north gate had been left standing open all winter').split(' ');

function sentence(rnd, minW, maxW) {
  const n = Math.floor(minW + rnd() * (maxW - minW));
  const out = [];
  for (let i = 0; i < n; i++) out.push(WORDS[Math.floor(rnd() * WORDS.length)]);
  out[0] = out[0][0].toUpperCase() + out[0].slice(1);
  return out.join(' ') + '.';
}

// A 3:2 plate as an inline data URI — no network, so the "image loaded" path is
// deterministic even with the radio off.
const OK_IMG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400">' +
  '<rect width="600" height="400" fill="#4f46e5"/>' +
  '<circle cx="300" cy="200" r="120" fill="#fbfaf8"/></svg>');

function makeChapter(n) {
  const rnd = lcg(1000 + n * 77);
  const blocks = [];
  blocks.push({ t: 'h2', c: 'Chapter ' + n + ' — The Ledger of Small Debts' });
  for (let i = 0; i < 38; i++) {
    const roll = rnd();
    if (i === 9)       blocks.push({ t: 'h3', c: 'An interruption' });
    else if (i === 17) blocks.push({ t: 'blockquote', c: sentence(rnd, 12, 24) });
    else if (i === 22) blocks.push({ t: 'hr' });
    else if (i === 26) blocks.push({ t: 'ul', items: [sentence(rnd, 4, 8), sentence(rnd, 4, 8), sentence(rnd, 4, 8)] });
    else if (i === 30) blocks.push({ t: 'note', c: 'Translator’s note: ' + sentence(rnd, 8, 14) });
    else if (i === 33) blocks.push({ t: 'pre', c: 'ledger[' + n + '] = {\n  gate: "open",\n  since: "winter"\n};' });
    else if (i === 35) blocks.push({ t: 'weird-unknown-type', c: 'This block type is not in the spec and must render as a paragraph.' });
    // XSS boundary: a hostile source site putting markup in a content string
    // must end up as literal characters, never as nodes.
    else if (i === 12) blocks.push({ t: 'p', c: 'HOSTILE <img src=x onerror="window.__pwned=1"> <script>window.__pwned=1<\/script> end.' });
    // Two illustrations: one that resolves (inline SVG data URI) and one that
    // cannot, so the collapse-on-error path is exercised for real.
    else if (i === 14) blocks.push({ t: 'img', src: OK_IMG, alt: 'A working plate' });
    else if (i === 15) blocks.push({ t: 'img', src: 'https://example.invalid/nope.png', alt: 'A dead plate' });
    // A scheme that must never reach an <img src>.
    else if (i === 16) blocks.push({ t: 'img', src: 'javascript:window.__pwned=1', alt: 'Hostile scheme' });
    else {
      const s = [];
      const count = 3 + Math.floor(roll * 3);
      for (let k = 0; k < count; k++) s.push(sentence(rnd, 10, 26));
      blocks.push({ t: 'p', c: s.join(' ') });
    }
  }
  const words = blocks.reduce((a, b) => a + String(b.c || (b.items || []).join(' ') || '').split(/\s+/).filter(Boolean).length, 0);
  return {
    id: 'c-' + String(n).padStart(4, '0'),
    num: n,
    title: 'The Ledger of Small Debts',
    wordCount: words,
    blocks: blocks,
  };
}

const CHAPTERS = [];
for (let i = 1; i <= 6; i++) CHAPTERS.push(makeChapter(i));

const SERIES = {
  id: 'test:novel-reader',
  type: 'lightnovel',
  title: 'A Test of Small Debts',
  cover: null,
  status: 'ongoing',
  language: 'en',
  source: 'user',
  chapterCount: CHAPTERS.length,
  chapters: CHAPTERS.map(c => ({ id: c.id, num: c.num, title: c.title, wordCount: c.wordCount })),
};

// The resolver the catalogue normally provides (ARCHITECTURE §4).
window.__resolveCalls = [];
window.resolveChapterContent = function (series, chapter) {
  window.__resolveCalls.push(chapter.id);
  const src = CHAPTERS.find(c => c.id === chapter.id);
  if (!src) return Promise.reject(new Error('no such chapter: ' + chapter.id));
  // Async on purpose — the real one goes to IndexedDB or the network.
  return new Promise(res => setTimeout(() => res({
    seriesId: series.id, id: src.id, num: src.num, title: src.title,
    kind: 'text', blocks: src.blocks, wordCount: src.wordCount,
  }), 10));
};
</script>

<script src="../js/novel-reader.js"></script>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// Test surface driven by Playwright
// ─────────────────────────────────────────────────────────────────────────────
function logLine(s) {
  const l = document.getElementById('log');
  if (l) l.textContent += s + '\n';
}

const T = {
  SERIES, CHAPTERS,

  /** Wipe every trace of a previous run so each test starts cold. */
  async reset() {
    try { localStorage.clear(); } catch (e) {}
    if (window.NovelReader.isOpen()) window.NovelReader.close({ navigate: false });
    try { await Store.deleteProgress(SERIES.id); } catch (e) {}
    window.__resolveCalls.length = 0;
    window.__navigatedAway = 0;
  },

  /** open() with chapter `n` (1-based) and an optional resume record. */
  async open(n, resume) {
    const i = (n || 1) - 1;
    await window.NovelReader.open({
      series: SERIES,
      chapter: SERIES.chapters[i],
      blocks: CHAPTERS[i].blocks,
      resume: resume || null,
    });
    return window.NovelReader.state();
  },

  mode(m) {
    // Drive it through the settings sheet, the way a user would, rather than
    // through a private method — the sheet is part of what is under test.
    const btn = [...document.querySelectorAll('#novel-screen .nv-seg button')]
      .find(b => b.dataset.value === m);
    if (!btn) throw new Error('no mode button for ' + m);
    btn.click();
    return window.NovelReader.state();
  },

  press(key, opts) {
    document.dispatchEvent(new KeyboardEvent('keydown', Object.assign({ key, bubbles: true, cancelable: true }, opts || {})));
    return window.NovelReader.state();
  },

  clickByLabel(label) {
    const b = document.querySelector('#novel-screen [aria-label="' + label + '"]');
    if (!b) throw new Error('no control labelled ' + label);
    b.click();
  },

  /** Text of the block the reader is currently anchored on. */
  anchorText() {
    const s = window.NovelReader.state();
    const sec = document.querySelector('#novel-screen .nv-section[data-chapter-id="' + s.anchor.chapterId + '"]');
    if (!sec) return null;
    const node = sec.querySelector('[data-b="' + s.anchor.blockIdx + '"]');
    return node ? node.textContent.slice(0, 60) : null;
  },

  /** Is the anchored block actually on screen right now? */
  anchorVisible() {
    const s = window.NovelReader.state();
    const sec = document.querySelector('#novel-screen .nv-section[data-chapter-id="' + s.anchor.chapterId + '"]');
    if (!sec) return false;
    const node = sec.querySelector('[data-b="' + s.anchor.blockIdx + '"]');
    if (!node) return false;
    const r = node.getBoundingClientRect();
    if (s.mode === 'paged') {
      const measure = document.querySelector('#novel-screen .nv-measure').getBoundingClientRect();
      // Overlap with the visible column box, with a pixel of slack.
      return r.right > measure.left - 1 && r.left < measure.right + 1;
    }
    return r.bottom > 0 && r.top < window.innerHeight;
  },

  counts() {
    const q = s => document.querySelectorAll('#novel-screen ' + s).length;
    return {
      sections: q('.nv-section'),
      paragraphs: q('.nv-doc p'),
      headings: q('.nv-doc h2') + q('.nv-doc h3'),
      dividers: q('.nv-divider'),
      chnav: q('.nv-chnav'),
      notes: q('.nv-note'),
      figures: q('.nv-figure'),
      lists: q('.nv-doc ul') + q('.nv-doc ol'),
      collapsed: q('.nv-section.nv-collapsed'),
      zones: q('.nv-zone'),
    };
  },

  footer() {
    const f = document.querySelector('#novel-screen .nv-status-line');
    return f ? f.textContent : '';
  },

  visibleText() {
    // Everything actually painted inside the column/scroll box.
    const doc = document.querySelector('#novel-screen .nv-doc');
    return doc ? doc.textContent.length : 0;
  },

  scrollToBottom() {
    const v = document.querySelector('#novel-screen .nv-viewport');
    v.scrollTop = v.scrollHeight;
    return v.scrollTop;
  },

  async progress() { return await Store.getProgress(SERIES.id); },

  dump() { logLine(JSON.stringify(window.NovelReader.state(), null, 1)); },

  hideHarness() {
    document.getElementById('harness').classList.add('off');
    document.getElementById('log').classList.add('off');
  },
};
window.T = T;
</script>
</body>
</html>
